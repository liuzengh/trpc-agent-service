services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trpc_agent_service
      POSTGRES_USER: trpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trpc -d trpc_agent_service"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_REDIS_PORT:-56379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  qdrant:
    image: qdrant/qdrant:v1.16.0
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_QDRANT_HTTP_PORT:-56333}:6333"
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_QDRANT_GRPC_PORT:-56334}:6334"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 2s

  # Observability must not sit on the request/execution critical path. The
  # application falls back to no-op telemetry if this optional service is down.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=file:/etc/otelcol/config.yaml"]
      interval: 10s
      timeout: 5s
      retries: 6

  jaeger:
    image: jaegertracing/all-in-one:1.57
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_JAEGER_PORT:-16686}:16686"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:14269/"]
      interval: 10s
      timeout: 5s
      retries: 6

  prometheus:
    image: prom/prometheus:v2.53.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./deploy/otel/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/otel/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_PROMETHEUS_PORT:-19090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      otel-collector:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-only-change-me}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_GRAFANA_PORT:-13000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    build: .
    stop_grace_period: ${TRPC_AGENT_SERVICE_COMPOSE_STOP_GRACE_PERIOD:-45s}
    environment:
      TRPC_AGENT_SERVICE_ROLE: gateway
      TRPC_AGENT_SERVICE_SECRET_BACKEND: ${TRPC_AGENT_SERVICE_SECRET_BACKEND:-env}
      TRPC_AGENT_SERVICE_SECRET_DIR: ${TRPC_AGENT_SERVICE_SECRET_DIR:-/var/run/secrets/trpc-agent-service}
      TRPC_AGENT_SERVICE_VAULT_ADDR: ${TRPC_AGENT_SERVICE_VAULT_ADDR:-}
      TRPC_AGENT_SERVICE_VAULT_MOUNT: ${TRPC_AGENT_SERVICE_VAULT_MOUNT:-secret}
      TRPC_AGENT_SERVICE_VAULT_TOKEN: ${TRPC_AGENT_SERVICE_VAULT_TOKEN:-}
      TRPC_AGENT_SERVICE_VAULT_NAMESPACE: ${TRPC_AGENT_SERVICE_VAULT_NAMESPACE:-}
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}

      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_REDIS_STREAM: ${TRPC_AGENT_SERVICE_REDIS_STREAM:-trpc-agent-service:dispatch}
      TRPC_AGENT_SERVICE_REDIS_GROUP: ${TRPC_AGENT_SERVICE_REDIS_GROUP:-workers}
      TRPC_AGENT_SERVICE_DISPATCHER_ID: gateway-1
      TRPC_AGENT_SERVICE_ADMIN_TOKEN: ${TRPC_AGENT_SERVICE_ADMIN_TOKEN:?set TRPC_AGENT_SERVICE_ADMIN_TOKEN in .env}
      TRPC_AGENT_SERVICE_OPERATOR_TOKEN: ${TRPC_AGENT_SERVICE_OPERATOR_TOKEN:-}
      TRPC_AGENT_SERVICE_OPERATOR_TENANT_IDS: ${TRPC_AGENT_SERVICE_OPERATOR_TENANT_IDS:-}
      TRPC_AGENT_SERVICE_AUDITOR_TOKEN: ${TRPC_AGENT_SERVICE_AUDITOR_TOKEN:-}
      TRPC_AGENT_SERVICE_AUDITOR_TENANT_IDS: ${TRPC_AGENT_SERVICE_AUDITOR_TENANT_IDS:-}
      TRPC_AGENT_SERVICE_JAEGER_URL: ${TRPC_AGENT_SERVICE_JAEGER_URL:-http://localhost:16686}
      TRPC_AGENT_SERVICE_PROMETHEUS_URL: ${TRPC_AGENT_SERVICE_PROMETHEUS_URL:-http://localhost:19090}
      TRPC_AGENT_SERVICE_GRAFANA_URL: ${TRPC_AGENT_SERVICE_GRAFANA_URL:-http://localhost:13000}
      TRPC_AGENT_SERVICE_OTEL_PROTOCOL: ${TRPC_AGENT_SERVICE_OTEL_PROTOCOL:-grpc}
      TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_MODEL_PRICING: ${TRPC_AGENT_SERVICE_MODEL_PRICING:-}
      TRPC_AGENT_SERVICE_MODEL_TIMEOUT: ${TRPC_AGENT_SERVICE_MODEL_TIMEOUT:-1m}
      TRPC_AGENT_SERVICE_SHUTDOWN_TIMEOUT: ${TRPC_AGENT_SERVICE_SHUTDOWN_TIMEOUT:-30s}
      TRPC_AGENT_SERVICE_WORKER_CONCURRENCY: ${TRPC_AGENT_SERVICE_WORKER_CONCURRENCY:-4}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: '${TRPC_AGENT_SERVICE_COS_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: '${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS: '${TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS:-{}}'
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_7765636f6d2d626f742d736563726574_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_7765636f6d2d626f742d736563726574_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6665697368752d6170702d736563726574_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6665697368752d6170702d736563726574_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d70726f76696465722d7461726765742d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d70726f76696465722d7461726765742d6b6579_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d65787465726e616c2d69642d686d61632d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d65787465726e616c2d69642d686d61632d6b6579_7631:-}
      TRPC_AGENT_SERVICE_HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Single IM long-connection owner. Do not scale this service until a
  # binding lease or sharding strategy is introduced.
  channel:
    build: .
    stop_grace_period: ${TRPC_AGENT_SERVICE_COMPOSE_STOP_GRACE_PERIOD:-45s}
    environment:
      TRPC_AGENT_SERVICE_ROLE: channel
      TRPC_AGENT_SERVICE_SECRET_BACKEND: ${TRPC_AGENT_SERVICE_SECRET_BACKEND:-env}
      TRPC_AGENT_SERVICE_SECRET_DIR: ${TRPC_AGENT_SERVICE_SECRET_DIR:-/var/run/secrets/trpc-agent-service}
      TRPC_AGENT_SERVICE_VAULT_ADDR: ${TRPC_AGENT_SERVICE_VAULT_ADDR:-}
      TRPC_AGENT_SERVICE_VAULT_MOUNT: ${TRPC_AGENT_SERVICE_VAULT_MOUNT:-secret}
      TRPC_AGENT_SERVICE_VAULT_TOKEN: ${TRPC_AGENT_SERVICE_VAULT_TOKEN:-}
      TRPC_AGENT_SERVICE_VAULT_NAMESPACE: ${TRPC_AGENT_SERVICE_VAULT_NAMESPACE:-}
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}
      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_REDIS_STREAM: ${TRPC_AGENT_SERVICE_REDIS_STREAM:-trpc-agent-service:dispatch}
      TRPC_AGENT_SERVICE_REDIS_GROUP: ${TRPC_AGENT_SERVICE_REDIS_GROUP:-workers}
      TRPC_AGENT_SERVICE_OTEL_PROTOCOL: ${TRPC_AGENT_SERVICE_OTEL_PROTOCOL:-grpc}
      TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: '${TRPC_AGENT_SERVICE_COS_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS: '${TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS:-{}}'
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_7765636f6d2d626f742d736563726574_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_7765636f6d2d626f742d736563726574_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6665697368752d6170702d736563726574_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6665697368752d6170702d736563726574_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d70726f76696465722d7461726765742d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d70726f76696465722d7461726765742d6b6579_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d65787465726e616c2d69642d686d61632d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d65787465726e616c2d69642d686d61632d6b6579_7631:-}
      TRPC_AGENT_SERVICE_HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  admin-ui:
    build:
      context: ./admin-ui
      args:
        VITE_JAEGER_URL: ${TRPC_AGENT_SERVICE_JAEGER_URL:-http://localhost:16686}
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "127.0.0.1:${TRPC_AGENT_SERVICE_COMPOSE_ADMIN_UI_PORT:-4173}:80"

  worker-1:
    build: .
    init: true
    stop_grace_period: ${TRPC_AGENT_SERVICE_COMPOSE_STOP_GRACE_PERIOD:-45s}
    environment:
      TRPC_AGENT_SERVICE_ROLE: worker
      TRPC_AGENT_SERVICE_WORKER_ID: worker-1
      TRPC_AGENT_SERVICE_SECRET_BACKEND: ${TRPC_AGENT_SERVICE_SECRET_BACKEND:-env}
      TRPC_AGENT_SERVICE_SECRET_DIR: ${TRPC_AGENT_SERVICE_SECRET_DIR:-/var/run/secrets/trpc-agent-service}
      TRPC_AGENT_SERVICE_VAULT_ADDR: ${TRPC_AGENT_SERVICE_VAULT_ADDR:-}
      TRPC_AGENT_SERVICE_VAULT_MOUNT: ${TRPC_AGENT_SERVICE_VAULT_MOUNT:-secret}
      TRPC_AGENT_SERVICE_VAULT_TOKEN: ${TRPC_AGENT_SERVICE_VAULT_TOKEN:-}
      TRPC_AGENT_SERVICE_VAULT_NAMESPACE: ${TRPC_AGENT_SERVICE_VAULT_NAMESPACE:-}
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}
      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_REDIS_STREAM: ${TRPC_AGENT_SERVICE_REDIS_STREAM:-trpc-agent-service:dispatch}
      TRPC_AGENT_SERVICE_REDIS_GROUP: ${TRPC_AGENT_SERVICE_REDIS_GROUP:-workers}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: '${TRPC_AGENT_SERVICE_COS_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: '${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS: '${TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS:-{}}'
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_716472616e742d6170692d6b6579_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6d6f64656c2d6170692d6b6579_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_7765636f6d2d626f742d736563726574_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_7765636f6d2d626f742d736563726574_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6665697368752d6170702d736563726574_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_6665697368752d6170702d736563726574_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d70726f76696465722d7461726765742d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d70726f76696465722d7461726765742d6b6579_7631:-}
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d65787465726e616c2d69642d686d61632d6b6579_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_696d2d65787465726e616c2d69642d686d61632d6b6579_7631:-}
      TRPC_AGENT_SERVICE_OTEL_PROTOCOL: ${TRPC_AGENT_SERVICE_OTEL_PROTOCOL:-grpc}
      TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT: ${TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT:-otel-collector:4317}
      TRPC_AGENT_SERVICE_MODEL_PRICING: ${TRPC_AGENT_SERVICE_MODEL_PRICING:-}
      TRPC_AGENT_SERVICE_MODEL_TIMEOUT: ${TRPC_AGENT_SERVICE_MODEL_TIMEOUT:-1m}
      TRPC_AGENT_SERVICE_SHUTDOWN_TIMEOUT: ${TRPC_AGENT_SERVICE_SHUTDOWN_TIMEOUT:-30s}
      TRPC_AGENT_SERVICE_WORKER_CONCURRENCY: ${TRPC_AGENT_SERVICE_WORKER_CONCURRENCY:-4}
      TRPC_AGENT_SERVICE_FAULT_PAUSE_AFTER_CLAIM: ${TRPC_AGENT_SERVICE_FAULT_PAUSE_AFTER_CLAIM:-}
      TRPC_AGENT_SERVICE_ARTIFACT_RETENTION: ${TRPC_AGENT_SERVICE_ARTIFACT_RETENTION:-720h}
      TRPC_AGENT_SERVICE_HTTP_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  worker-2:
    build: .
    init: true
    stop_grace_period: ${TRPC_AGENT_SERVICE_COMPOSE_STOP_GRACE_PERIOD:-45s}
    environment:
      TRPC_AGENT_SERVICE_ROLE: worker
      TRPC_AGENT_SERVICE_WORKER_ID: worker-2
      TRPC_AGENT_SERVICE_SECRET_BACKEND: ${TRPC_AGENT_SERVICE_SECRET_BACKEND:-env}
      TRPC_AGENT_SERVICE_SECRET_DIR: ${TRPC_AGENT_SERVICE_SECRET_DIR:-/var/run/secrets/trpc-agent-service}
      TRPC_AGENT_SERVICE_VAULT_ADDR: ${TRPC_AGENT_SERVICE_VAULT_ADDR:-}
      TRPC_AGENT_SERVICE_VAULT_MOUNT: ${TRPC_AGENT_SERVICE_VAULT_MOUNT:-secret}
      TRPC_AGENT_SERVICE_VAULT_TOKEN: ${TRPC_AGENT_SERVICE_VAULT_TOKEN:-}
      TRPC_AGENT_SERVICE_VAULT_NAMESPACE: ${TRPC_AGENT_SERVICE_VAULT_NAMESPACE:-}
      TRPC_AGENT_SERVICE_POSTGRES_DSN: ${TRPC_AGENT_SERVICE_POSTGRES_DSN:?set TRPC_AGENT_SERVICE_POSTGRES_DSN in .env}
      TRPC_AGENT_SERVICE_REDIS_URL: ${TRPC_AGENT_SERVICE_REDIS_URL:?set TRPC_AGENT_SERVICE_REDIS_URL in .env}
      TRPC_AGENT_SERVICE_REDIS_STREAM: ${TRPC_AGENT_SERVICE_REDIS_STREAM:-trpc-agent-service:dispatch}
      TRPC_AGENT_SERVICE_REDIS_GROUP: ${TRPC_AGENT_SERVICE_REDIS_GROUP:-workers}
      TRPC_AGENT_SERVICE_COS_ENDPOINTS: '${TRPC_AGENT_SERVICE_COS_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: '${TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS:-{}}'
      TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS: '${TRPC_AGENT_SERVICE_TENCENTDB_GATEWAYS:-{}}'
      TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631: ${TRPC_AGENT_SERVICE_SECRET_74656e616e742d78786e_6b6e6f776c65646765_636f732d63726564656e7469616c73_7631:-}
