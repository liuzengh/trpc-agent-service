extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
      - key: trpc.go.agent.llm_request
        action: delete
      - key: trpc.go.agent.llm_response
        action: delete
      - key: gen_ai.input.messages
        action: delete
      - key: gen_ai.input.messages.otel
        action: delete
      - key: gen_ai.output.messages
        action: delete
      - key: gen_ai.output.messages.otel
        action: delete
      - key: gen_ai.system_instructions
        action: delete
      - key: gen_ai.request.tool.definitions
        action: delete
      - key: gen_ai.tool.call.arguments
        action: delete
      - key: gen_ai.tool.call.result
        action: delete
      - key: gen_ai.workflow.request
        action: delete
      - key: gen_ai.workflow.response
        action: delete
      - key: error.message
        action: delete
      - key: db.statement
        action: delete
  transform/redact_errors:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(status.message, "redacted") where status.message != ""
      - context: spanevent
        statements:
          - delete_key(attributes, "exception.message")
          - delete_key(attributes, "exception.stacktrace")
  resource:
    attributes:
      - key: deployment.environment
        value: local
        action: upsert
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200
  prometheus:
    endpoint: 0.0.0.0:9464
    namespace: tenant_agent_otel
    resource_to_telemetry_conversion:
      enabled: true

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, transform/redact_errors, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [debug]
