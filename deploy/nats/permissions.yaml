version: 1
roles:
  - user: reconciler
    password_env: NATS_RECONCILER_PASSWORD
    publish: ["$JS.API.>"]
    subscribe: ["_INBOX.reconciler.>"]
  - user: control
    password_env: NATS_CONTROL_PASSWORD
    publish: ["control.channel-route.v1", "control.runtime-manifest.published.v1"]
    subscribe: ["_INBOX.control.>"]
  - user: gateway
    password_env: NATS_GATEWAY_PASSWORD
    publish:
      - execution.run-requested.v1
      - $JS.API.STREAM.INFO.CHANNEL_ROUTES_V1
      - $JS.API.STREAM.INFO.RUN_REQUESTS_V1
      - $JS.API.STREAM.INFO.RUNTIME_MANIFESTS_V1
      - $JS.API.STREAM.INFO.REPLY_INTENTS_V1
      - $JS.API.CONSUMER.INFO.REPLY_INTENTS_V1.channel-gateway-replies-v1
      - $JS.API.CONSUMER.MSG.NEXT.REPLY_INTENTS_V1.channel-gateway-replies-v1
      - $JS.ACK.REPLY_INTENTS_V1.channel-gateway-replies-v1.>
      - $JS.API.CONSUMER.INFO.CHANNEL_ROUTES_V1.channel-gateway-routes-v1
      - $JS.API.CONSUMER.MSG.NEXT.CHANNEL_ROUTES_V1.channel-gateway-routes-v1
      - $JS.ACK.CHANNEL_ROUTES_V1.channel-gateway-routes-v1.>
    subscribe: ["_INBOX.gateway.>"]
  - user: worker
    password_env: NATS_WORKER_PASSWORD
    publish:
      - execution.reply-intent.v1
      - $JS.API.STREAM.INFO.RUNTIME_MANIFESTS_V1
      - $JS.API.STREAM.INFO.RUN_REQUESTS_V1
      - $JS.API.STREAM.INFO.REPLY_INTENTS_V1
      - $JS.API.CONSUMER.INFO.RUNTIME_MANIFESTS_V1.worker-manifests-v1
      - $JS.API.CONSUMER.MSG.NEXT.RUNTIME_MANIFESTS_V1.worker-manifests-v1
      - $JS.ACK.RUNTIME_MANIFESTS_V1.worker-manifests-v1.>
      - $JS.API.CONSUMER.INFO.RUN_REQUESTS_V1.agent-worker-runs-v1
      - $JS.API.CONSUMER.MSG.NEXT.RUN_REQUESTS_V1.agent-worker-runs-v1
      - $JS.ACK.RUN_REQUESTS_V1.agent-worker-runs-v1.>
    subscribe: ["_INBOX.worker.>"]
