deployment_mode: production

server:
  address: ":8080"
  queue_size: 2048
  worker_count: 16

admin:
  mode: oidc
  issuer: http://oidc-fixture:8081
  audience: trpc-admin
  jwks_url: http://oidc-fixture:8081/jwks
  roles_claim: roles
  tenants_claim: tenants
  clock_skew: 30s
  jwks_cache_ttl: 30s

secrets:
  # The Compose acceptance mounts this directory as a local stand-in for an
  # external Secret Manager. Production Kubernetes uses the SecretProviderClass
  # manifest instead; references, not values, are persisted in revisions.
  provider: file
  fail_closed: true
  cache_ttl: 5m

health:
  probe_interval: 2s
  probe_timeout: 1s

content_safety:
  enabled: true
  backend: postgres
  fail_closed: true
  policy_version: production-v1
  timeout: 2s
  lease_ttl: 10s

queue:
  backend: postgres
  dsn_env: secret://file/db-runtime-dsn
  poll_interval: 250ms
  lease_ttl: 30s
  batch_size: 32
  inbox_max_attempts: 5
  outbox_max_attempts: 8
  retry_base: 500ms
  retry_max: 5s

control_plane:
  backend: postgres
  refresh_interval: 2s
  heartbeat_interval: 2s
  heartbeat_ttl: 10s
  ack_timeout: 10s
  node_id_env: HOSTNAME

coordination:
  backend: redis
  redis_url_env: secret://file/redis-url
  key_prefix: trpc-agent-production
  lock_ttl: 30s
  dedup_ttl: 24h

telemetry:
  service_name: trpc-agent-service
  otlp_endpoint: otel-collector:4318
  otlp_protocol: http

tenants:
  - tenant_id: acme
    version: "production-bootstrap-1"
    enabled: true
    app:
      name: support-assistant
      agent_name: support-agent
      description: Production acceptance tenant
      instruction: Answer concisely and never reveal credentials.
    model:
      provider: openai
      name: acceptance-model
      base_url: http://model-fixture:8090/v1
      api_key_env: secret://file/model-api-key
      fallback_provider: mock
      max_tokens: 256
      temperature: 0
      streaming: false
      input_price_per_million: 1
      output_price_per_million: 2
    tools:
      allow: [calculator, current_time]
      deny: []
      require_confirmation: []
      side_effects: []
    channels: []
    data:
      session: {type: sql, dsn_env: secret://file/db-runtime-dsn, namespace: production-session}
      memory: {type: redis, dsn_env: secret://file/redis-url, namespace: production-memory}
      summary: {type: sql, dsn_env: secret://file/db-runtime-dsn, namespace: production-session}
      artifact:
        type: object
        provider: s3
        dsn_env: secret://file/db-runtime-dsn
        migration_dsn_env: secret://file/db-migration-dsn
        bucket: trpc-agent
        endpoint: http://minio:9000
        region: us-east-1
        access_key_env: secret://file/minio-access-key
        secret_key_env: secret://file/minio-secret-key
        path_style: true
      knowledge: {type: disabled}
      audit_log: {type: sql, dsn_env: secret://file/db-runtime-dsn}
    audit:
      enabled: true
      sink: sql
      spool_path: /tmp/audit-spool
      log_content: false
      redact_patterns: ["(?i)canary-[a-z0-9-]+"]
    budget:
      requests_per_minute: 120
      max_input_chars: 12000
      monthly_cost_usd: 100
