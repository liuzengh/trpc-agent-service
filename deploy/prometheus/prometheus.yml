global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: trpc-service
    static_configs:
      # The internal metrics listener (TRPC_METRICS_ADDR). :8080 is the
      # gateway's public callback port and serves no /metrics.
      - targets: ["host.docker.internal:8082"]
