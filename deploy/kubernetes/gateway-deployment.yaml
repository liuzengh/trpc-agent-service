apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-gateway
  namespace: trpc-agent
spec:
  replicas: 2
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: trpc-agent-service
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trpc-agent-service
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gateway
          image: ghcr.io/example/trpc-agent-service:replace-me
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: SERVICE_ROLE, value: gateway}
            - name: NODE_ID
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: CONFIG_PATH, value: /etc/trpc-agent/platform.json}
            - {name: AUTO_MIGRATE, value: "false"}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: database-url}}
            - name: REDIS_ADDR
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: redis-addr}}
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: redis-password, optional: true}}
            - name: KAFKA_BROKERS
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: kafka-brokers}}
            - {name: KAFKA_TOPIC, value: agent.inbound.v1}
            - name: MODEL_API_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: model-api-key}}
            - name: TELEGRAM_EXAMPLE_CONFIG_JSON
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: telegram-config-json}}
            - {name: LOGIN_SECURE_COOKIE, value: "true"}
            - name: LOGIN_STATE_SECRET
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: login-state-secret}}
            - name: LOGIN_PROVIDERS_JSON
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: login-providers-json}}
            - name: LOGIN_CALLBACK_URL
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: login-callback-url}}
            - name: WECOM_LOGIN_SECRET
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: wecom-login-secret, optional: true}}
            - name: FEISHU_LOGIN_SECRET
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: feishu-login-secret, optional: true}}
            - name: OIDC_LOGIN_SECRET
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: oidc-login-secret, optional: true}}
            - name: SYSTEM_ADMIN_PROVIDER_ID
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: system-admin-provider-id}}
            - name: SYSTEM_ADMIN_SUBJECT_ID
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: system-admin-subject-id}}
            - name: AUDIT_HMAC_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: audit-hmac-key}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: http://otel-collector.observability.svc.cluster.local:4318}
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: langfuse-public-key, optional: true}}
            - name: LANGFUSE_SECRET_KEY
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: langfuse-secret-key, optional: true}}
            - name: LANGFUSE_HOST
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: langfuse-host, optional: true}}
          volumeMounts:
            - {name: configuration, mountPath: /etc/trpc-agent, readOnly: true}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
      volumes:
        - name: configuration
          configMap: {name: trpc-agent-service-config}
