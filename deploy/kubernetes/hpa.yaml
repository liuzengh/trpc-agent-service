apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trpc-agent-gateway
  namespace: trpc-agent
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: trpc-agent-gateway}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trpc-agent-worker
  namespace: trpc-agent
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: trpc-agent-worker}
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies: [{type: Percent, value: 100, periodSeconds: 60}]
    scaleDown:
      stabilizationWindowSeconds: 300
      policies: [{type: Percent, value: 25, periodSeconds: 60}]
