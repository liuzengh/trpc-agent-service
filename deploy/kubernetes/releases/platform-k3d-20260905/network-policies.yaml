    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
    ports: [{protocol: TCP, port: 9093}, {protocol: TCP, port: 4143}]
  egress:
  - to:
    - podSelector: {matchLabels: {app: postgres}}
    ports: [{protocol: TCP, port: 5432}]
  - to:
    - podSelector: {matchLabels: {app: redis}}
    ports: [{protocol: TCP, port: 6379}]
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
      podSelector:
        matchLabels: {app: otel-collector}
    ports: [{protocol: TCP, port: 4317}]
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: egress-gateway}
      podSelector:
        matchLabels: {app: agent-egress-gateway}
    ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-runtime-data-plane-egress
spec:
  podSelector: {matchLabels: {app: agent-worker}}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: data-plane}
      podSelector:
        matchLabels: {app: qdrant}
    ports:
    - {protocol: TCP, port: 6334}
    - {protocol: TCP, port: 4143}
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: data-plane}
      podSelector:
        matchLabels: {app: object-storage}
    ports:
    - {protocol: TCP, port: 443}
    - {protocol: TCP, port: 4143}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
