# Baseline policy for a dedicated application namespace. Namespace labels used
# below must be applied by the cluster operator before rollout:
#   observability namespace: agent-platform-access=observability
#   OTLP collector Pods:     app=otel-collector
#   ingress namespace:       agent-platform-access=public-ingress
#   operator namespace:      agent-platform-access=admin-ingress
#   data-plane namespace:    agent-platform-access=data-plane
# Worker, Summary Worker and Delivery reach model, Tool and IM providers only through a
# separately operated egress gateway. The gateway namespace needs the label
# agent-platform-access=egress-gateway and owns provider FQDN/SNI allowlists,
# TLS inspection policy and its own external NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - {protocol: UDP, port: 53}
    - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-boundaries
spec:
  podSelector: {matchLabels: {app: agent-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {agent-platform-access: public-ingress}
    ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 4143}]
  - from:
    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
    ports: [{protocol: TCP, port: 8080}, {protocol: TCP, port: 4143}]
  egress:
  - to:
    - podSelector: {matchLabels: {app: postgres}}
    ports: [{protocol: TCP, port: 5432}]
  - to:
    - podSelector: {matchLabels: {app: redis}}
    ports: [{protocol: TCP, port: 6379}]
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
      podSelector:
        matchLabels: {app: otel-collector}
    ports: [{protocol: TCP, port: 4317}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-linkerd-control-plane
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: linkerd
      podSelector:
        matchLabels:
          linkerd.io/control-plane-ns: linkerd
    ports:
    - {protocol: TCP, port: 8080}
    - {protocol: TCP, port: 8086}
    - {protocol: TCP, port: 8090}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: consumer-boundaries
spec:
  podSelector: {matchLabels: {app: agent-consumer}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
    ports: [{protocol: TCP, port: 9091}, {protocol: TCP, port: 4143}]
  egress:
  - to:
    - podSelector: {matchLabels: {app: postgres}}
    ports: [{protocol: TCP, port: 5432}]
  - to:
    - podSelector: {matchLabels: {app: agent-worker}}
    ports: [{protocol: TCP, port: 9090}]
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
      podSelector:
        matchLabels: {app: otel-collector}
    ports: [{protocol: TCP, port: 4317}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshed-postgres-egress
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [agent-gateway, agent-consumer, agent-worker, agent-summary-worker, agent-delivery, agent-admin, agent-migrate]
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: postgres}}
    ports: [{protocol: TCP, port: 4143}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshed-redis-egress
spec:
  podSelector:
    matchExpressions:
    - key: app
      operator: In
      values: [agent-gateway, agent-worker, agent-summary-worker]
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: redis}}
    ports: [{protocol: TCP, port: 4143}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: meshed-worker-egress
spec:
  podSelector: {matchLabels: {app: agent-consumer}}
  policyTypes: [Egress]
  egress:
  - to:
    - podSelector: {matchLabels: {app: agent-worker}}
    ports: [{protocol: TCP, port: 4143}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-boundaries
spec:
  podSelector: {matchLabels: {app: agent-worker}}
  policyTypes: [Ingress, Egress]
  ingress:
  - from:
    - podSelector: {matchLabels: {app: agent-consumer}}
    ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 4143}]
  - from:
    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
    ports: [{protocol: TCP, port: 9090}, {protocol: TCP, port: 4143}]
  egress:
  - to:
    - podSelector: {matchLabels: {app: postgres}}
    ports: [{protocol: TCP, port: 5432}]
  - to:
    - podSelector: {matchLabels: {app: redis}}
    ports: [{protocol: TCP, port: 6379}]
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: observability}
      podSelector:
        matchLabels: {app: otel-collector}
    ports: [{protocol: TCP, port: 4317}]
  - to:
    - namespaceSelector:
        matchLabels: {agent-platform-access: egress-gateway}
      podSelector:
        matchLabels: {app: agent-egress-gateway}
    ports: [{protocol: TCP, port: 443}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: summary-worker-boundaries
spec:
  podSelector: {matchLabels: {app: agent-summary-worker}}
  policyTypes: [Ingress, Egress]
  ingress:
