apiVersion: v1
kind: Service
metadata:
  name: trpc-agent-service-gateway
  labels:
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: gateway
spec:
  selector:
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: trpc-agent-service-worker
  labels:
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: worker
spec:
  selector:
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: worker
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
