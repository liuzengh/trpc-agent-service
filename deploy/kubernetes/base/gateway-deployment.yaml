apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-gateway
  labels:
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: trpc-agent-service
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trpc-agent-service
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/liuzengh/trpc-agent-service:replace-me
          imagePullPolicy: IfNotPresent
          args: ["gateway"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: trpc-service-runtime
            - secretRef:
                name: trpc-service-runtime-secrets
          lifecycle:
            preStop:
              exec:
                # The hook starts the existing shell-free role, which signals
                # container PID 1 and waits for readiness to become unready.
                command: ["/trpc-service", "prestop"]
          env:
            - name: TRPC_PRESTOP_TARGET_PID
              value: "1"
            - name: TRPC_PRESTOP_SETTLE_DELAY
              value: 2s
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
