apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: trpc-agent-service

resources:
  - gateway-deployment.yaml
  - gateway-service.yaml
  - gateway-pdb.yaml
  - worker-deployment.yaml
  - worker-pdb.yaml
  - worker-deny-ingress.yaml

# An environment overlay must replace this immutable image reference with the
# reviewed release digest. It must also supply trpc-service-runtime and
# trpc-service-runtime-secrets; the base intentionally contains no endpoints,
# credentials, or Kubernetes Secret bodies.
images:
  - name: ghcr.io/liuzengh/trpc-agent-service
    newName: ghcr.io/liuzengh/trpc-agent-service
    newTag: replace-me
