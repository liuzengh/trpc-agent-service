apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trpc-agent-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trpc-agent-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 75}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - {type: Percent, value: 100, periodSeconds: 60}
        - {type: Pods, value: 4, periodSeconds: 60}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Percent, value: 25, periodSeconds: 60}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trpc-agent-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trpc-agent-worker
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: 75}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 15
      policies:
        - {type: Percent, value: 100, periodSeconds: 60}
        - {type: Pods, value: 6, periodSeconds: 60}
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Percent, value: 25, periodSeconds: 60}
