apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trpc-agent-service-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trpc-agent-service-gateway
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trpc-agent-service-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trpc-agent-service-worker
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Prometheus Adapter (or another external metrics provider) must expose
    # this Prometheus metric before the business-metric signal can scale the
    # worker. The adapter must max duplicate scrape-instance samples; these
    # are the same database aggregate, not per-worker queue shards.
    - type: External
      external:
        metric:
          name: trpc_agent_service_queue_backlog
        target:
          type: Value
          value: "10"
