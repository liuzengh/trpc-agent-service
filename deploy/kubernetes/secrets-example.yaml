# Example secrets - DO NOT use these values in production
# Create actual secrets using: kubectl create secret generic <name> --from-literal=key=value

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  url: "REPLACE_WITH_A_TLS_VERIFIED_POSTGRES_URL"
---
apiVersion: v1
kind: Secret
metadata:
  name: redis-credentials
type: Opaque
stringData:
  url: "REPLACE_WITH_A_TLS_REDIS_URL"
---
apiVersion: v1
kind: Secret
metadata:
  name: tenant-storage-credentials
type: Opaque
stringData:
  postgres-url: "REPLACE_WITH_A_LEAST_PRIVILEGE_TLS_VERIFIED_TENANT_POSTGRES_URL"
  redis-url: "REPLACE_WITH_A_LEAST_PRIVILEGE_TLS_TENANT_REDIS_URL"
---
# Worker-only credentials named by runtime-data-plane-config profiles. Prefer
# External Secrets/Vault workload identity over applying this example.
apiVersion: v1
kind: Secret
metadata:
  name: runtime-data-plane-credentials
type: Opaque
stringData:
  qdrant-api-key: "REPLACE_WITH_TENANT_SCOPED_QDRANT_KEY"
  embedding-api-key: "REPLACE_WITH_MODEL_PROVIDER_KEY"
  s3-access-key: "REPLACE_WITH_LEAST_PRIVILEGE_S3_ACCESS_KEY"
  s3-secret-key: "REPLACE_WITH_LEAST_PRIVILEGE_S3_SECRET_KEY"
---
# Worker-only MCP header values referenced by mcp-profiles.json. Prefer an
# external secret manager and workload identity over applying this example.
apiVersion: v1
kind: Secret
metadata:
  name: mcp-profile-credentials
type: Opaque
stringData:
  support-authorization: "REPLACE_WITH_BEARER_OR_PROVIDER_HEADER_VALUE"
---
# Model-provider values referenced by Tenant ModelConfig.apiKeyRef. Only the
# execution processes receive this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: model-provider-credentials
type: Opaque
stringData:
  openai-api-key: "REPLACE_WITH_PROVIDER_API_KEY"
---
# Channel values referenced by ChannelBinding TokenRef/SecretRef/AESKeyRef.
# Only Gateway and Delivery receive this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: channel-credentials
type: Opaque
stringData:
  wecom-callback-token: "REPLACE_WITH_WECOM_CALLBACK_TOKEN"
  wecom-corp-secret: "REPLACE_WITH_WECOM_CORP_SECRET"
  wecom-encoding-aes-key: "REPLACE_WITH_WECOM_ENCODING_AES_KEY"
  telegram-bot-token: "REPLACE_WITH_TELEGRAM_BOT_TOKEN"
  telegram-webhook-secret: "REPLACE_WITH_TELEGRAM_WEBHOOK_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: master-key
type: Opaque
stringData:
  key: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: service-auth
type: Opaque
stringData:
  key: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: audit-identity
type: Opaque
stringData:
  key: "CHANGE_ME_TO_A_RANDOM_SHARED_HMAC_KEY"
---
apiVersion: v1
kind: Secret
metadata:
  name: metrics-auth
type: Opaque
stringData:
  # Prometheus must send Authorization: Bearer <token> when scraping.
  token: "CHANGE_ME_TO_A_RANDOM_METRICS_TOKEN"
---
# CA bundle used by workloads for the TLS-protected OTLP collector service.
# Provision this Secret in the application namespace. The collector
# certificate must contain otel-collector.observability.svc in its SANs. This
# placeholder is intentionally not deployable.
apiVersion: v1
kind: Secret
metadata:
  name: otel-collector-tls
type: Opaque
stringData:
  ca.crt: |
    REPLACE_WITH_COLLECTOR_CA_PEM
---
apiVersion: v1
kind: Secret
metadata:
  name: admin-api-token
type: Opaque
stringData:
  token: "CHANGE_ME"
  # Optional. Prefer an external secret manager in production. Example shape:
  # [{"id":"tenant-a-release","token":"32+ characters","role":"release_manager","tenantIds":["tenant-a"]}]
  principals-json: ""
