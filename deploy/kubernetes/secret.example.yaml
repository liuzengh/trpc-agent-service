apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  TRPC_AGENT_MODEL_NAME: replace-me
  OPENAI_API_KEY: replace-me
  REDIS_URL: redis://replace-me:6379/0
  REDIS_KEY_PREFIX: trpc-agent-production
  TRPC_AGENT_POSTGRES_URL: postgres://replace-me
  TRPC_AGENT_ADMIN_PRINCIPALS_JSON: '[{"name":"platform-admin","token":"replace-with-secret-manager","role":"superadmin","tenant_ids":["*"]}]'
