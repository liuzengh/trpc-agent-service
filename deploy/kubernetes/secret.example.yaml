# EXAMPLE ONLY. Do not apply this file as-is and never commit real values.
# Create both Secrets out-of-band, for example with kubectl create secret.
# The Kustomize base/overlays reference these fixed names but do not generate
# or store their contents.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-service-secrets
type: Opaque
stringData:
  # Required by Gateway and Worker. Use a managed PostgreSQL DSN in production.
  TRPC_AGENT_SERVICE_POSTGRES_DSN: postgres://user:replace-me@postgres.example.invalid:5432/trpc_agent_service?sslmode=require
  # Required by Gateway, Channel and Worker. Keep credentials in this Secret even when
  # the URL points to a managed Redis service.
  TRPC_AGENT_SERVICE_REDIS_URL: rediss://:replace-me@redis.example.invalid:6379/0
  # Add the matching scoped provider key only when the selected tenant
  # AppConfig enables that Provider SecretRef. For a real WeCom/Feishu binding,
  # add both platform-internal keys below for every (tenant_id, app_id):
  # im-provider-target-key@v1 encrypts durable Provider reply targets.
  # im-external-id-hmac-key@v1 hashes external user/chat/thread IDs.
  # The runtime key shape is:
  # TRPC_AGENT_SERVICE_SECRET_<tenant-id-hex>_<app-id-hex>_<secret-name-hex>_<version-hex>
  # The production overlay mounts these keys as files and selects the file
  # SecretProvider backend; values must be injected out-of-band.
  # where every suffix is lower-case hex of UTF-8 bytes. Values must decode
  # from unpadded Base64URL to 32 random bytes. Keep all values out of Git;
  # this example intentionally contains no real scoped key.
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-service-admin-secrets
type: Opaque
stringData:
  # Required by Gateway/Admin API only. Never mount this Secret into Worker or
  # Channel pods.
  TRPC_AGENT_SERVICE_ADMIN_TOKEN: replace-me-with-an-external-secret
  # Optional least-privilege roles. Each token requires its tenant allowlist.
  # TRPC_AGENT_SERVICE_OPERATOR_TOKEN: replace-me-with-an-external-secret
  # TRPC_AGENT_SERVICE_OPERATOR_TENANT_IDS: tenant-a,tenant-b
  # TRPC_AGENT_SERVICE_AUDITOR_TOKEN: replace-me-with-an-external-secret
  # TRPC_AGENT_SERVICE_AUDITOR_TENANT_IDS: tenant-a,tenant-b
