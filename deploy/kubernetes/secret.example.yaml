apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-service-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  database-url: postgres://trpc_platform:replace-me@postgres:5432/trpc_agent?sslmode=require
  redis-addr: redis:6379
  redis-password: replace-me
  kafka-brokers: kafka:9092
  model-api-key: replace-me
  telegram-config-json: '{"secret_token":"replace-me","bot_token":"replace-me"}'
  audit-hmac-key: replace-with-at-least-32-random-bytes
  login-state-secret: replace-with-at-least-32-random-bytes
  login-providers-json: '{"providers":[{"id":"wecom-main","type":"wecom","display_name":"企业微信","corp_id":"ww-replace-me","agent_id":1000002,"secret_ref":"env:WECOM_LOGIN_SECRET"}]}'
  login-callback-url: https://agent.example.com/api/v1/auth/callback
  wecom-login-secret: replace-me
  # Add these keys only when the corresponding Provider is present in login-providers-json.
  # feishu-login-secret: replace-me
  # oidc-login-secret: replace-me
  system-admin-provider-id: wecom-main
  system-admin-subject-id: replace-with-first-admin-userid
  # Optional: configure all three to enable the framework-native Langfuse exporter.
  langfuse-public-key: pk-replace-me
  langfuse-secret-key: sk-replace-me
  langfuse-host: cloud.langfuse.com:443
