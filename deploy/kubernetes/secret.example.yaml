# Copy this template to a secret managed by your deployment system. Do not
# commit a populated Secret or use these placeholders outside local testing.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-service-secrets
type: Opaque
stringData:
  TRPC_POSTGRES_DSN: postgres://USER:PASSWORD@HOST:5432/DATABASE?sslmode=verify-full
  TRPC_API_TOKEN: replace-me
  TRPC_TENANT_ID: t_replace-me
  TRPC_APP_ID: app_replace-me
  TRPC_ADMIN_TOKEN: replace-me
  TRPC_ADMIN_TENANTS: t_replace-me
  TRPC_ADMIN_USERNAME: replace-me
  TRPC_ADMIN_PASSWORD: replace-me
  TRPC_MODEL_API_KEY: replace-me
  # Required only when a Backend Profile binds artifact to provider s3.
  TRPC_S3_ACCESS_KEY_ID: replace-me
  TRPC_S3_SECRET_KEY: replace-me
