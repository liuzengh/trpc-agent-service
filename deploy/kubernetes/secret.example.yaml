apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-gateway-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  # No Telegram send/model/Admin keys. Hosted MCP uses a provider read/write URL;
  # platform code narrows Gateway use to wecom_mcp_read (not an upstream read-only key).
  TELEGRAM_WEBHOOK_SECRET: replace-with-webhook-secret
  # Add WECOM_MCP_URL only when an explicit MCP receiver is enabled.
  REDIS_URL: redis://replace-me:6379/0
  REDIS_KEY_PREFIX: trpc-agent-production
  TRPC_AGENT_POSTGRES_URL: postgres://replace-with-gateway-account
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-admin-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  TRPC_AGENT_ADMIN_PRINCIPALS_JSON: '[{"name":"platform-admin","token":"replace-with-random-secret-manager-token","role":"superadmin","tenant_ids":["*"]}]'
  REDIS_URL: redis://replace-me:6379/0
  REDIS_KEY_PREFIX: trpc-agent-production
  TRPC_AGENT_POSTGRES_URL: postgres://replace-with-admin-account
  # Add only storage credentials required for Admin migration/document operations.
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-relay-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  REDIS_URL: redis://replace-me:6379/0
  REDIS_KEY_PREFIX: trpc-agent-production
  TRPC_AGENT_POSTGRES_URL: postgres://replace-with-relay-account
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-worker-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  TRPC_AGENT_MODEL_NAME: replace-me
  OPENAI_API_KEY: replace-with-model-key
  REDIS_URL: redis://replace-me:6379/0
  REDIS_KEY_PREFIX: trpc-agent-production
  TRPC_AGENT_POSTGRES_URL: postgres://replace-with-worker-account
  # Add tenant model/storage/embedding credentials explicitly; no IM send/Admin keys.
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-sender-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  TELEGRAM_BOT_TOKEN: replace-with-bot-token
  # Add WECOM_MCP_URL for wecom_mcp_send only; never put it in Worker/Jobs secrets.
  REDIS_URL: redis://replace-me:6379/0
  REDIS_KEY_PREFIX: trpc-agent-production
  TRPC_AGENT_POSTGRES_URL: postgres://replace-with-sender-account
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-jobs-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  TRPC_AGENT_MODEL_NAME: replace-me
  OPENAI_API_KEY: replace-with-background-model-key
  REDIS_URL: redis://replace-me:6379/0
  REDIS_KEY_PREFIX: trpc-agent-production
  TRPC_AGENT_POSTGRES_URL: postgres://replace-with-jobs-account
  # Add only storage/embedding credentials needed by the enabled background jobs.
---
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-migration-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  # A DDL-capable account is injected only into the one-off migration Job.
  TRPC_AGENT_POSTGRES_URL: postgres://replace-with-migration-account
