apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-service-secrets
  namespace: trpc-agent
  labels:
    app.kubernetes.io/part-of: trpc-agent-service
    app.kubernetes.io/component: kind-test-secret
type: Opaque
stringData:
  # Disposable credentials for the ephemeral Kind cluster only.
  database-url: postgres://trpc_local:kind-local-password@postgres:5432/trpc_agent?sslmode=disable
  redis-addr: redis:6379
  redis-password: ""
  kafka-brokers: redpanda:9092
  model-api-key: mock-key
  s3-config-json: '{"endpoint":"http://minio:9000","region":"us-east-1","bucket":"trpc-artifacts","access_key":"trpc_minio","secret_key":"kind-minio-password"}'
  telegram-config-json: '{"secret_token":"kind-secret","bot_token":"kind-token"}'
  audit-hmac-key: kind-audit-hmac-key-at-least-32-bytes
  login-state-secret: kind-login-state-secret-at-least-32-bytes
  login-providers-json: '{"providers":[{"id":"wecom-kind","type":"wecom","display_name":"企业微信","corp_id":"kind-corp","agent_id":1,"secret_ref":"env:WECOM_LOGIN_SECRET"}]}'
  login-callback-url: http://127.0.0.1:18080/api/v1/auth/callback
  wecom-login-secret: kind-login-secret
  system-admin-provider-id: wecom-kind
  system-admin-subject-id: kind-admin
