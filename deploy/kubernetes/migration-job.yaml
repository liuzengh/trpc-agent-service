apiVersion: batch/v1
kind: Job
metadata:
  name: trpc-agent-service-migrate
  namespace: trpc-agent
  annotations:
    trpc-agent-service/migration: "forward-only"
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trpc-agent-service
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/example/trpc-agent-service:replace-me
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: trpc-agent-service-secrets, key: database-url}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
