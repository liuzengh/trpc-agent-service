apiVersion: v1
kind: Service
metadata:
  name: demo-postgres
spec:
  clusterIP: None
  selector: {app.kubernetes.io/name: demo-postgres}
  ports: [{name: postgres, port: 5432, targetPort: postgres}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-postgres
spec:
  serviceName: demo-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: demo-postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: demo-postgres}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: trpc_agent}
            - {name: POSTGRES_USER, value: trpc_agent}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: trpc-agent-secrets, key: postgres-password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          readinessProbe:
            exec: {command: ["/bin/sh", "-c", "pg_isready -U trpc_agent -d trpc_agent"]}
            periodSeconds: 3
            timeoutSeconds: 2
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}
