apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    exporters:
      debug: {verbosity: basic}
    service:
      pipelines:
        traces: {receivers: [otlp], exporters: [debug]}
        metrics: {receivers: [otlp], exporters: [debug]}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-otel-collector
spec:
  selector: {app.kubernetes.io/name: demo-otel-collector}
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: demo-otel-collector}
  template:
    metadata:
      labels: {app.kubernetes.io/name: demo-otel-collector}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/config.yaml"]
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 4318}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts: [{name: config, mountPath: /etc/otel, readOnly: true}]
      volumes: [{name: config, configMap: {name: demo-otel-collector}}]
