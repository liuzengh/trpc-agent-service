apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-agent-service-config
data:
  TRPC_AGENT_SERVICE_SECRET_BACKEND: file
  TRPC_AGENT_SERVICE_SECRET_DIR: /var/run/secrets/trpc-agent-service
  # Replace example endpoints before applying this overlay.
  TRPC_AGENT_SERVICE_OTEL_TRACES_ENDPOINT: otel-collector.production.example.com:4317
  TRPC_AGENT_SERVICE_OTEL_METRICS_ENDPOINT: otel-collector.production.example.com:4317
  TRPC_AGENT_SERVICE_MODEL_TIMEOUT: 1m
  TRPC_AGENT_SERVICE_SHUTDOWN_TIMEOUT: 60s
  TRPC_AGENT_SERVICE_WORKER_CONCURRENCY: "8"
  TRPC_AGENT_SERVICE_QDRANT_ENDPOINTS: '{"knowledge":"https://qdrant.production.example.com:6334"}'
