apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trpc-agent-gateway
  namespace: trpc-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trpc-agent-service
      app.kubernetes.io/component: gateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trpc-agent-worker
  namespace: trpc-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trpc-agent-service
      app.kubernetes.io/component: worker
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: trpc-agent-channel
  namespace: trpc-agent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trpc-agent-service
      app.kubernetes.io/component: channel
