global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'gateway'
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: ['gateway:8080']
  
  - job_name: 'worker'
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: ['worker:9090']

  - job_name: 'summary-worker'
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: ['summary-worker:9093']
  
  - job_name: 'admin'
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: ['admin:8081']

  - job_name: 'consumer'
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: ['consumer:9091']

  - job_name: 'delivery'
    bearer_token_file: /tmp/metrics-token
    static_configs:
      - targets: ['delivery:9092']
