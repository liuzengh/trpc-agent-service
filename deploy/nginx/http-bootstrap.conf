# First install: replace agent.example.com with YOUR domain.
# Install as /etc/nginx/conf.d/trpc-agent.conf, not alongside the HTTPS template.
# No Agent or admin route is public before the certificate is ready.
server {
    listen 80;
    server_name agent.example.com;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / { return 404; }
}
