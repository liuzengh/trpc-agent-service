# Replace ALL occurrences of agent.example.com with YOUR domain.
# Replaces http-bootstrap.conf at /etc/nginx/conf.d/trpc-agent.conf.
# Nginx runs on the host; the platform is published on loopback port 18080.
# For a native Go process, change BOTH upstream ports below to its actual port.
# No request bodies, query strings, Authorization or webhook headers in access logs.
log_format trpc_agent_public '$remote_addr [$time_local] "$request_method" '
                             '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name agent.example.com;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://agent.example.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name agent.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/agent.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agent.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    client_body_timeout 15s;
    access_log /var/log/nginx/trpc-agent-access.log trpc_agent_public;
    error_log /var/log/nginx/trpc-agent-error.log warn;

    location = /healthz {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_next_upstream off;
    }

    # Keep the complete callback path and the provider's verification headers.
    # No slash/URI suffix on proxy_pass in this regular-expression location.
    location ~ ^/callbacks/(telegram|wecom)/[A-Za-z0-9._-]+$ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
    }

    # Admin is reached through SSH local port forwarding, not this public vhost.
    # This also blocks /chat, /inbound, /readyz, /metrics and arbitrary API paths.
    location / { return 404; }
}
