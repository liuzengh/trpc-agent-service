global
  log stdout format raw local0
  maxconn 2048

defaults
  mode http
  option httplog
  timeout connect 3s
  timeout client 30s
  timeout server 30s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 5s

frontend gateway
  bind :8080
  # Liveness must remain reachable when all workers temporarily fail readiness.
  use_backend live_nodes if { path -i /healthz }
  default_backend service_nodes

backend live_nodes
  balance roundrobin
  option httpchk GET /healthz
  server-template live 2 service:8080 check resolvers docker init-addr libc,none

backend service_nodes
  balance roundrobin
  option httpchk GET /readyz
  server-template service 2 service:8080 check resolvers docker init-addr libc,none
