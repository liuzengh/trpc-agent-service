apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-gateway
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent, role: gateway}}
  template:
    metadata: {labels: {app: trpc-agent, role: gateway}}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/docjlm/trpc-agent-service:0.1.0
          args: ["serve", "--config", "/app/configs/container.yaml", "--role", "gateway"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: WECOM_CREDENTIAL_FILE, value: /run/secrets/wecom.txt}
            - {name: FEISHU_CREDENTIAL_FILE, value: /run/secrets/feishu.txt}
            - {name: DEEPSEEK_KEY_FILE, value: /run/secrets/deepseek.txt}
          volumeMounts:
            - {name: credentials, mountPath: /run/secrets, readOnly: true}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
      volumes:
        - name: credentials
          secret: {secretName: trpc-agent-credentials}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-worker
spec:
  replicas: 3
  selector: {matchLabels: {app: trpc-agent, role: worker}}
  template:
    metadata: {labels: {app: trpc-agent, role: worker}}
    spec:
      containers:
        - name: worker
          image: ghcr.io/docjlm/trpc-agent-service:0.1.0
          args: ["serve", "--config", "/app/configs/container.yaml", "--role", "worker"]
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: DEEPSEEK_KEY_FILE, value: /run/secrets/deepseek.txt}
          volumeMounts:
            - {name: credentials, mountPath: /run/secrets, readOnly: true}
          readinessProbe: {httpGet: {path: /readyz, port: http}}
      volumes:
        - name: credentials
          secret: {secretName: trpc-agent-credentials}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-agent-admin
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent, role: admin}}
  template:
    metadata: {labels: {app: trpc-agent, role: admin}}
    spec:
      containers:
        - name: admin
          image: ghcr.io/docjlm/trpc-agent-service:0.1.0
          args: ["serve", "--config", "/app/configs/container.yaml", "--role", "admin"]
          ports: [{name: http, containerPort: 8080}]
---
apiVersion: v1
kind: Service
metadata:
  name: trpc-agent-admin
spec:
  selector: {app: trpc-agent, role: admin}
  ports: [{name: http, port: 8080, targetPort: http}]
