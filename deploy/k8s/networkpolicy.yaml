apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trpc-agent-service-default-deny
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trpc-agent-service
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: trpc-agent-service-allow-required
  namespace: trpc-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: trpc-agent-service
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trpc-agent
        - namespaceSelector:
            matchLabels:
              trpc-agent-service-access: "enabled"
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 6379
          protocol: TCP
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
