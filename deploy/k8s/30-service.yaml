# ClusterIP Service. The Pod is not reachable from outside the cluster on
# purpose: the IM callbacks need a public HTTPS entry point, and that is what
# 60-ingress.yaml is for. Exposing this with a LoadBalancer instead would give
# the callbacks plain HTTP and no certificate, which neither WeCom nor WeChat
# customer service accepts.
#
# Not verified in a cluster (fact #3). The endpoint-tracking behaviour described
# below is standard Kubernetes readiness semantics, not something measured here.
# What has been measured is /readyz answering 200 against the compose stack's
# Redis; the 503 transition and the recovery without a restart are covered by
# web.TestReadyzReportsDependencyFailure, web.TestReadyzRecoversWithoutRestart
# and storage.TestPingRedisIsReadOnlyAndTracksTheBackend. Drill D4 exercises the
# same transition by really stopping Redis (spec §2.6).
apiVersion: v1
kind: Service
metadata:
  name: trpc-agent-service
  labels:
    app: trpc-agent-service
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    app: trpc-agent-service
  ports:
    # Same number as containerPort and as the compose stack, so that a URL in
    # the docs reads the same in every environment. Readiness is per-Pod, so
    # the Service endpoints track /readyz automatically: when Redis goes down
    # the Pod leaves this list within ~10s and comes back on recovery, which is
    # the cluster-side half of D4.
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
