# Secret, example. Two shapes are shown; apply ONE of them.
#
# This file is safe to `kubectl apply` as it stands — it creates the Secret with
# a placeholder value so the Pod boots and fails only at the first model call
# (a 401 from the provider), instead of sitting in CreateContainerConfigError
# because a referenced Secret does not exist. Replace the value before real use:
#
#   kubectl create secret generic trpc-agent-model \
#       --from-literal=MODEL_API_KEY=sk-... \
#       --dry-run=client -o yaml | kubectl apply -f -
#
# The real Secret is never committed. config.yaml is gitignored for exactly this
# reason, and .dockerignore excludes it so `COPY . .` cannot bake a key into an
# image layer.
#
# Not verified in a cluster (fact #3): no kind/minikube/k3d/helm on this
# machine, so these manifests are checked by offline decode plus field-by-field
# comparison against the upstream schema.

# --- SHAPE A (what 20-deployment.yaml expects): key in the environment -------
# Simple, and the only shape that works with a ConfigMap-held config, because
# MODEL_API_KEY overrides the DEFAULT TENANT ONLY (config.go: applyEnvOverride
# is called as applyEnvOverride(cfg.Tenants[cfg.DefaultTenant])). One tenant,
# one key.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-model
  labels:
    app: trpc-agent-service
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: config
type: Opaque
stringData:
  MODEL_API_KEY: REPLACE_WITH_YOUR_KEY
  ADMIN_TOKEN: REPLACE_WITH_A_LONG_RANDOM_ADMIN_TOKEN
  # Optional, same override scope. Both have working defaults in the ConfigMap,
  # so set them here only to change them without editing the ConfigMap.
  # MODEL_NAME: deepseek-v4-flash
  # MODEL_BASE_URL: https://api.deepseek.com
---
# --- SHAPE C: the reliable roles' shared inputs -------------------------------
# 21-deployment-reliable.yaml references this Secret by name. The DSN is a
# secret; the four knowledge endpoints are marked `optional: true` there, so
# deleting those keys is how a deployment turns the knowledge pipeline off
# (a revision that pins knowledge_search in such a deployment fails loudly at
# execution assembly rather than half-indexing).
#
# The DSN points at a MySQL the cluster can reach; running the database
# itself belongs to whoever operates the cluster, not to this manifest set.
apiVersion: v1
kind: Secret
metadata:
  name: trpc-agent-reliable
  labels:
    app: trpc-agent-service
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: config
type: Opaque
stringData:
  CONTROLPLANE_MYSQL_DSN: REPLACE_user:password@tcp(mysql.example:3306)/tas
  # Optional knowledge pipeline (delete or leave as-is; see above).
  KNOWLEDGE_QDRANT_URL: http://qdrant.example:6333
  KNOWLEDGE_MINIO_ENDPOINT: http://minio.example:9000
  KNOWLEDGE_MINIO_USER: REPLACE_MINIO_USER
  KNOWLEDGE_MINIO_PASSWORD: REPLACE_MINIO_PASSWORD
  EMBEDDING_BASE_URL: https://api.deepseek.com/v1
  EMBEDDING_MODEL: REPLACE_EMBEDDING_MODEL

# --- SHAPE B: the whole config.yaml in a Secret, for N tenants with N keys ----
# Per-tenant keys cannot come from the environment, so the file that holds them
# cannot be a ConfigMap. Delete shape A, apply this, and change ONE line in
# 20-deployment.yaml: the initContainer's `config-src` volume switches its
# `configMap:` block for `secret: {secretName: trpc-agent-config}`. Everything
# downstream is identical — the initContainer copies /config-src/config.yaml
# into the writable emptyDir without caring where it came from, and the emptyDir
# is what makes live admin writes work (fact #19).
#
# Use an external secret store (External Secrets Operator, Sealed Secrets, SOPS)
# rather than committing this, obviously. It is spelled out here because "put
# the config in a Secret" is not actionable without knowing which key the volume
# expects: `config.yaml`.
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: trpc-agent-config
#   labels:
#     app: trpc-agent-service
# type: Opaque
# stringData:
#   config.yaml: |
#     default_tenant: demo
#     storage:
#       session:
#         backend: redis
#         redis_url: redis://redis:6379
#     log:
#       json: true
#     tenants:
#       - id: demo
#         name: Demo
#         model:
#           name: deepseek-v4-flash
#           api_key: sk-tenant-demo
#           base_url: https://api.deepseek.com
#       - id: acme
#         name: Acme
#         model:
#           name: deepseek-chat
#           api_key: sk-tenant-acme      # a second, genuinely different key
#           base_url: https://api.deepseek.com
