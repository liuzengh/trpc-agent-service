apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: trpc-agent-service-runtime-secrets
  namespace: trpc-agent
spec:
  provider: vault
  parameters:
    roleName: trpc-agent-service
    vaultAddress: https://vault.example.invalid
    objects: |
      - objectName: runtime-postgres-dsn
        secretPath: kv/data/trpc-agent/production
        secretKey: runtime-postgres-dsn
      - objectName: redis-url
        secretPath: kv/data/trpc-agent/production
        secretKey: redis-url
      - objectName: dashscope-api-key
        secretPath: kv/data/trpc-agent/production
        secretKey: dashscope-api-key
      - objectName: acme-telegram-bot-token
        secretPath: kv/data/trpc-agent/production
        secretKey: acme-telegram-bot-token
      - objectName: acme-telegram-webhook-secret
        secretPath: kv/data/trpc-agent/production
        secretKey: acme-telegram-webhook-secret
      - objectName: acme-slack-bot-token
        secretPath: kv/data/trpc-agent/production
        secretKey: acme-slack-bot-token
      - objectName: acme-slack-signing-secret
        secretPath: kv/data/trpc-agent/production
        secretKey: acme-slack-signing-secret
      - objectName: acme-wecom-aibot-id
        secretPath: kv/data/trpc-agent/production
        secretKey: acme-wecom-aibot-id
      - objectName: acme-wecom-aibot-secret
        secretPath: kv/data/trpc-agent/production
        secretKey: acme-wecom-aibot-secret
      - objectName: globex-telegram-bot-token
        secretPath: kv/data/trpc-agent/production
        secretKey: globex-telegram-bot-token
      - objectName: globex-telegram-webhook-secret
        secretPath: kv/data/trpc-agent/production
        secretKey: globex-telegram-webhook-secret
  secretObjects:
    - secretName: trpc-agent-service-secrets
      type: Opaque
      data:
        - objectName: runtime-postgres-dsn
          key: runtime-postgres-dsn
        - objectName: redis-url
          key: redis-url
        - objectName: dashscope-api-key
          key: dashscope-api-key
        - objectName: acme-telegram-bot-token
          key: acme-telegram-bot-token
        - objectName: acme-telegram-webhook-secret
          key: acme-telegram-webhook-secret
        - objectName: acme-slack-bot-token
          key: acme-slack-bot-token
        - objectName: acme-slack-signing-secret
          key: acme-slack-signing-secret
        - objectName: acme-wecom-aibot-id
          key: acme-wecom-aibot-id
        - objectName: acme-wecom-aibot-secret
          key: acme-wecom-aibot-secret
        - objectName: globex-telegram-bot-token
          key: globex-telegram-bot-token
        - objectName: globex-telegram-webhook-secret
          key: globex-telegram-webhook-secret
