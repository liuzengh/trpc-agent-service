# Agent Gateway: IM callbacks in, replies out. Stateless, scales freely.
# The public entry point is the Ingress in ingress.yaml — this Service stays
# cluster-internal and the Ingress terminates the TLS the IM platforms require.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trpc-gateway
spec:
  replicas: 2
  selector:
    matchLabels: {app: trpc-gateway}
  template:
    metadata:
      labels: {app: trpc-gateway}
    spec:
      containers:
        - name: gateway
          image: trpc-agent-service:v1 # pin a release tag; never :latest in production
          args: ["gateway"]
          envFrom:
            - configMapRef: {name: trpc-service-config}
            - secretRef: {name: trpc-service-infra}
          volumeMounts:
            # KMS bootstrap token -> TRPC_SECRETS_DIR; without this mount the
            # resolver fails closed and the pod CrashLoops at startup.
            - {name: kms-bootstrap, mountPath: /etc/trpc/secrets, readOnly: true}
          env:
            # kubelet readiness probes and Prometheus scrape the pod IP,
            # which a loopback-only metrics bind would not serve.
            - {name: TRPC_METRICS_ADDR, value: ":8082"}
          ports:
            - {containerPort: 8080, name: http}
            # Internal only: no Service selects it, so it never reaches the
            # Ingress the IM platforms webhook through.
            - {containerPort: 8082, name: metrics}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests: {cpu: "500m", memory: "512Mi"}
            limits: {cpu: "2", memory: "4Gi"}
      volumes:
        - name: kms-bootstrap
          secret:
            secretName: trpc-kms-bootstrap
            items: [{key: token, path: kms-bootstrap-token}]
---
apiVersion: v1
kind: Service
metadata:
  name: trpc-gateway
spec:
  # Stated explicitly, mirroring admin.yaml; omission would also yield
  # ClusterIP. This Service is internal — the only public entry is ingress.yaml.
  #
  # Clusters without an ingress controller: switch to LoadBalancer (terminating
  # TLS through your provider's certificate annotations) or NodePort, and
  # delete ingress.yaml. The IM platforms only webhook to HTTPS with a trusted
  # certificate, so plain TCP passthrough is not an option.
  type: ClusterIP
  selector: {app: trpc-gateway}
  ports:
    - {port: 80, targetPort: http}
