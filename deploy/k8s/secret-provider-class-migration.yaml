apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: trpc-agent-service-migration-secrets
  namespace: trpc-agent
  labels:
    app.kubernetes.io/name: trpc-agent-service
    app.kubernetes.io/component: database-migrator
spec:
  provider: vault
  parameters:
    roleName: trpc-agent-service-migrator
    vaultAddress: https://vault.example.invalid
    objects: |
      - objectName: migration-postgres-dsn
        secretPath: kv/data/trpc-agent/production
        secretKey: migration-postgres-dsn
  secretObjects:
    - secretName: trpc-agent-migration-secrets
      type: Opaque
      data:
        - objectName: migration-postgres-dsn
          key: migration-postgres-dsn
