name: trpc-agent-service

# Shared environment. platform-2 must re-merge this anchor in its own
# environment block: a bare `environment:` key would REPLACE the whole map
# (YAML anchors merge shallowly) and silently strip the DSNs, leaving the
# replica running as a skeleton without MySQL/Redis/Admin routes.
x-platform-env: &platform-env
  TRPC_SERVICE_LISTEN_ADDR: ":8080"
  TRPC_SERVICE_REDIS_ADDR: "redis:6379"
  TRPC_SERVICE_MYSQL_DSN: "agent:${MYSQL_PASSWORD:-agent-dev-password}@tcp(mysql:3306)/agent?parseTime=true&charset=utf8mb4"
  TRPC_SERVICE_PGVECTOR_DSN: "postgres://agent:${POSTGRES_PASSWORD:-agent-dev-password}@pgvector:5432/agent?sslmode=disable"
  TRPC_SERVICE_MEM0_BASE_URL: "http://mem0:8000"
  TRPC_SERVICE_ADMIN_USERNAME: "admin"
  TRPC_SERVICE_ADMIN_PASSWORD_REF: "env:TRPC_SERVICE_ADMIN_PASSWORD"
  TRPC_SERVICE_ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin-dev-password}"
  TRPC_SERVICE_EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
  TRPC_SERVICE_EMBEDDING_API_KEY_REF: "env:TRPC_SERVICE_EMBEDDING_API_KEY"
  TRPC_SERVICE_EMBEDDING_API_KEY: "${EMBEDDING_API_KEY:-development-placeholder}"
  TRPC_SERVICE_EMBEDDING_BASE_URL: "${EMBEDDING_BASE_URL:-}"
  TRPC_SERVICE_EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
  MODEL_API_KEY_TENANT_A: "${DEEPSEEK_API_KEY:-development-placeholder}"
  MODEL_API_KEY_TENANT_B: "${DEEPSEEK_API_KEY:-development-placeholder}"
  FEISHU_APP_ID: "${FEISHU_APP_ID:-}"
  FEISHU_APP_SECRET_TENANT_A: "${FEISHU_APP_SECRET_TENANT_A:-}"
  FEISHU_VERIFY_TENANT_A: "${FEISHU_VERIFY_TENANT_A:-}"
  FEISHU_ENCRYPT_KEY_TENANT_A: "${FEISHU_ENCRYPT_KEY_TENANT_A:-}"
  # Two real IMs: Feishu (webhook) + WeCom AI-bot long-connection.
  # Self-built app callbacks (channel "wecom") are not the WeCom path.
  TRPC_SERVICE_WECOMBOT_ROUTE_KEYS: "${WECOMBOT_ROUTE_KEYS:-}"
  WECOM_BOT_SECRET: "${WECOM_BOT_SECRET:-}"

x-platform: &platform
  build:
    context: .
  restart: unless-stopped
  environment:
    <<: *platform-env
  depends_on:
    redis:
      condition: service_healthy
    mysql:
      condition: service_healthy
    pgvector:
      condition: service_healthy
    mem0:
      condition: service_started
  expose:
    - "8080"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 15s

services:
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      platform-1:
        condition: service_healthy
      platform-2:
        condition: service_healthy

  platform-1:
    <<: *platform
    # WeCom AI-bot allows only ONE long connection per bot, so only this
    # replica holds the wecombot channel. Feishu/webui stay load-balanced.

  platform-2:
    <<: *platform
    environment:
      # Re-merge the shared environment and only override the WeCom AI-bot
      # route keys: this replica must not dial the WeCom bot WebSocket or it
      # would kick platform-1's connection (one long connection per bot).
      <<: *platform-env
      TRPC_SERVICE_WECOMBOT_ROUTE_KEYS: ""

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: agent
      MYSQL_USER: agent
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-agent-dev-password}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root-dev-password}"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uagent -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agent-dev-password}"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./docker/pgvector-init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent && psql -U agent -d agent -tAc \"SELECT 1 FROM pg_extension WHERE extname='vector'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  mem0:
    image: mem0/mem0-api-server:latest
    # Docker Hub currently publishes this image for arm64 only. Docker Desktop
    # uses QEMU on amd64; for production build server/Dockerfile natively.
    platform: linux/arm64
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: "${MEM0_LLM_API_KEY:-development-placeholder}"
      JWT_SECRET: "${MEM0_JWT_SECRET:-replace-this-in-production}"
      AUTH_DISABLED: "true"
      POSTGRES_HOST: pgvector
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-agent-dev-password}"
    depends_on:
      pgvector:
        condition: service_healthy
    expose:
      - "8000"

volumes:
  redis-data:
  mysql-data:
  pgvector-data:
