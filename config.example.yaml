# Tenant & model configuration template.
# Copy to config.yaml and fill in real values:  cp config.example.yaml config.yaml
# config.yaml is gitignored — never commit real API keys.
#
# MODEL_API_KEY / MODEL_NAME / MODEL_BASE_URL environment variables, if set,
# override the default tenant's model settings (dev convenience).
# STORAGE_SESSION_BACKEND / STORAGE_SESSION_REDIS_URL override the storage
# section below the same way.

default_tenant: demo

# Shared session backend (docs/spec-storage-redis.md). Omit the whole block
# for the in-process memory default; switch to redis for restart-safe and
# future multi-node sessions. Local redis:
#   docker run -d --name redis -p 6379:6379 redis:7-alpine
# storage:
#   session:
#     backend: redis                     # memory (default) | redis
#     redis_url: redis://127.0.0.1:6379  # required for redis; rediss:// for TLS
#     key_prefix: "trpc-agent-service:"  # optional, this is the default
#     session_ttl: 72h                   # optional, 0/omit = never expire

# Governance & observability (proposal doc 3.5). Every block below is
# optional; the shown values are the defaults, so omit blocks you don't
# need to keep the file clean.
# log:
#   level: info        # debug | info | warn | error
#   json: false        # true = JSON encoding for container deployments
# audit:
#   file: data/audit.jsonl   # append-only JSONL trail; omit = log-only audit
# telemetry:
#   traces:
#     exporter: off                          # off | stdout | otlp
#     endpoint: http://127.0.0.1:4318        # required for otlp (OTLP/HTTP)
#   metrics:
#     exporter: off                          # off | stdout | otlp
#     endpoint: http://127.0.0.1:4318        # required for otlp (OTLP/HTTP)
#     interval: 15s                          # push interval, default 15s

tenants:
  - id: demo
    name: Demo Tenant
    model:
      name: deepseek-v4-flash        # model name of an OpenAI-compatible service
      api_key: REPLACE_WITH_YOUR_KEY # secret, keep out of git
      base_url: https://api.deepseek.com  # optional; omit for official OpenAI
    # WeCom (企业微信) binding — callback URL is
    # https://<public-host>/callback/wecom/<tenant id>
    # A declared wecom block must be complete or startup fails.
    # channels:
    #   wecom:
    #     corp_id: ww1234567890abcdef        # 企业 ID
    #     corp_secret: REPLACE_WITH_SECRET   # 应用 Secret
    #     agent_id: 1000002                  # 应用 AgentId（数字）
    #     token: REPLACE_WITH_TOKEN          # 回调配置 Token
    #     encoding_aes_key: REPLACE_43_CHARS # 回调配置 EncodingAESKey，43 位
    # WeChat customer service (微信客服) binding — callback URL is
    # https://<public-host>/callback/wechat_kf/<tenant id>
    # No agent_id: replies target the open_kfid carried by each callback
    # event. A declared wechat_kf block must be complete or startup fails.
    # channels:
    #   wechat_kf:
    #     corp_id: ww1234567890abcdef        # 企业 ID
    #     secret: REPLACE_WITH_KF_SECRET     # 微信客服 Secret（与企微应用 Secret 不同）
    #     token: REPLACE_WITH_TOKEN          # 回调配置 Token
    #     encoding_aes_key: REPLACE_43_CHARS # 回调配置 EncodingAESKey，43 位
    # Per-tenant guardrails (proposal doc 3.5). Omit the block to allow
    # everything; also manageable at runtime via PUT /admin/tenants/{id}.
    # guardrails:
    #   max_input_bytes: 8192                  # reject oversized input; 0/omit = no limit
    #   blocked_keywords: ["敏感词"]            # input tripwire, case-insensitive
    #   output_blocked_keywords: ["内部资料"]   # streaming output tripwire, cuts the reply off

  - id: demo-alt
    name: Demo Tenant Alt
    model:
      name: deepseek-chat
      api_key: REPLACE_WITH_YOUR_KEY
      base_url: https://api.deepseek.com
