{
  "openapi": "3.1.0",
  "info": {
    "title": "Control Channel preflight private workload API",
    "version": "1.0.0",
    "description": "Separate mTLS preflight listener. Claim diagnostic_policy selects exactly one provider and its consumer: telegram_preflight for legacy/telegram-receive-modes-v1; wecom_preflight for wecom_long_connection_v1. Resolve and Complete recheck the persisted task provider and claim. WeCom resolves only the exact wecom.bot_secret after explicit owner consent; Telegram resolves only telegram.bot_token. No normal enabled-account runtime authority is granted. Credentials appear only in the no-store mTLS resolve response."
  },
  "paths": {
    "/internal/v1/channel-preflights:claim": {
      "post": {
        "operationId": "claimChannelPreflight",
        "tags": [
          "Channel Preflight"
        ],
        "security": [
          {
            "workloadMTLS": []
          }
        ],
        "description": "Body <= 4 KiB. limit=1. Scope/source epoch must match authenticated workload. Claim token is 32 CSPRNG bytes encoded unpadded base64url; only its hash persists. Idempotency scope is principal+instance+boot epoch+claim_request_id; same request replays grant/204 for 5 minutes without extending its 30-second lease or 120-second job deadline. server_time is refreshed on every response. At most two claims per job; no renew. Rate <=2 claim/s per instance. Configuration origin is statically checked and digest recomputed, never fetched; first claim pins it. Recheck requested_by ACTIVE OWNER before issuing any grant.",
        "responses": {
          "400": {
            "description": "Stable sanitized diagnostic; no-store.",
