    "/internal/v1/channel-preflights/{preflight_id}:complete": {
      "post": {
        "operationId": "completeChannelPreflight",
        "tags": [
          "Channel Preflight"
        ],
        "security": [
          {
            "workloadMTLS": []
          }
        ],
        "description": "Body <=16 KiB. Exact claim owner/fence is required. Same original claim and same canonical completion payload replays 204 even after expiry; checked_at and receipt never move. Authenticate/match receipt before first-completion authorization/expiry checks. Changed payload -> RESULT_CONFLICT, stale lease/identity ->409; first completion rechecks ACTIVE OWNER and current frozen connection plus pinned Gateway config. Exactly 8 ordered redacted checks with strict status/code/details; Control aggregates only first 6 (FAIL > UNKNOWN/SKIPPED > WARN > PASS). Control server acceptance time determines checked_at and five-minute expiry, not observed_at. Raw Telegram URL/error, Token and webhook secret are forbidden. Completion never emits RunRequested or updates connection READY.",
        "responses": {
          "400": {
            "description": "Stable sanitized diagnostic; no-store.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
