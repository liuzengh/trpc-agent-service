          "202": {
            "description": "Accepted; same-key replay returns the identical creation receipt, not current task state.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Location": {
                "schema": {
                  "type": "string"
                },
                "description": "Same-origin fixed relative status_url from the creation receipt."
              },
              "Retry-After": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "2"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "../../../schemas/channel/v1/preflight-created.schema.json"
                }
              }
            }
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../../../schemas/channel/v1/preflight-create.schema.json"
              },
              "examples": {
                "wecom": {
                  "value": {
                    "expected_account_revision": 1,
                    "expected_connection_revision": 1,
                    "expected_bot_secret_version": 1,
                    "allow_connection_probe": true
                  }
                }
              }
            }
          }
        },
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128,
              "pattern": "^[!-~]+$"
            }
          }
        ]
      }
    },
