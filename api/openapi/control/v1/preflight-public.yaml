{
  "openapi": "3.1.0",
  "info": {
    "title": "Control Channel preflight API",
    "version": "1.0.0",
    "description": "Saved disabled-account diagnostics. Telegram remains read-only; WeCom requires explicit allow_connection_probe consent for a real short-lived subscribe that may replace another client. No account enable, business messages, Run, Binding, Deployment or Worker prerequisite. Authentication is not delivery verification."
  },
  "paths": {
    "/v1/tenants/{tenant_id}/channel-accounts/{account_id}/preflights": {
      "parameters": [
        {
          "name": "tenant_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
          }
        },
        {
          "name": "account_id",
          "in": "path",
          "required": true,
          "schema": {
            "type": "string",
            "minLength": 1,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$"
          }
        }
      ],
      "post": {
        "operationId": "createChannelPreflight",
        "tags": [
          "Channel Preflight"
        ],
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "description": "OWNER and disabled account required. Telegram uses expected_bot_token_version; WeCom uses expected_bot_secret_version, and allow_connection_probe must be explicitly true. Account, connection and selected credential versions are checked atomically. Missing WeCom consent returns 422 CHANNEL_PREFLIGHT_CONNECTION_PROBE_CONFIRMATION_REQUIRED. Consent is part of idempotency input. A WeCom subscribe is an active connection probe, not a read-only API, and may replace another client of the same Bot. Gateway drops any diagnostic business frames and sends no messages.",
        "responses": {
          "400": {
            "description": "Stable sanitized diagnostic; no-store.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChannelError"
                }
              }
            }
          },
          "401": {
            "description": "Stable sanitized diagnostic; no-store.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
