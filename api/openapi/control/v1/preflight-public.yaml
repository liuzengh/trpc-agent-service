              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChannelError"
                }
              }
            }
          },
          "429": {
            "description": "Stable sanitized diagnostic; no-store.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
                    "no-store"
                  ]
                }
              },
              "Retry-After": {
                "schema": {
                  "type": "integer",
                  "minimum": 1
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChannelError"
                }
              }
            }
          },
          "503": {
            "description": "Stable sanitized diagnostic; no-store.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
