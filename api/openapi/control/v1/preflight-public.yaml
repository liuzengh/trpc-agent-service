                  "enum": [
                    "no-store"
                  ]
                }
              }
            },
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ChannelError"
                }
              }
            }
          },
          "409": {
            "description": "Stable sanitized diagnostic; no-store.",
