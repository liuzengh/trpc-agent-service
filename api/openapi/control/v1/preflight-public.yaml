      "get": {
        "operationId": "getChannelPreflight",
        "tags": [
          "Channel Preflight"
        ],
        "security": [
          {
            "cookieAuth": []
          }
        ],
        "description": "ACTIVE unrestricted Session and ACTIVE tenant MEMBER required. Cross-tenant/invisible accounts or results return 404. state, diagnostic outcome, account freshness and Gateway config freshness are independent. COMPLETED does not imply account enabled or delivery success. The final two checks always disclose unavailable restore materials and NOT_TESTED delivery. GET exposes effective terminal timeout after 120 seconds even without any Gateway. Metadata-only changes do not stale connection facts; results are valid for 5 minutes and retained 24 hours. Results never expose credential IDs/values, claim tokens, raw provider URLs/errors or actual mismatched bot identity.",
        "responses": {
          "400": {
            "description": "Stable sanitized diagnostic; no-store.",
            "headers": {
              "Cache-Control": {
                "schema": {
                  "type": "string",
                  "enum": [
