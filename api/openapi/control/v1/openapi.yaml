        expected_revision: {type: integer, minimum: 1}
        spec: {type: object}
    DraftRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision: {type: integer, minimum: 1}
    ValidationDiagnostic:
      type: object
      additionalProperties: false
      required: [code, severity, pointer, node_id, message]
      properties:
        code: {type: string}
        severity: {type: string, enum: [error, warning]}
        pointer: {type: string}
        node_id: {type: string, nullable: true}
        message: {type: string}
    ValidationReport:
      type: object
      additionalProperties: false
      required: [valid, schema_version, draft_revision, diagnostics]
      properties:
        valid: {type: boolean}
        schema_version: {type: string}
        draft_revision: {type: integer, minimum: 1}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/ValidationDiagnostic'}
    PublishAgentVersionResponse:
      type: object
      additionalProperties: false
      required: [version, validation]
      properties:
        version: {$ref: '#/components/schemas/AgentVersion'}
        validation: {$ref: '#/components/schemas/ValidationReport'}
    AgentPage:
      type: object
      additionalProperties: false
      required: [agents, offset, limit, total]
      properties:
        agents:
          type: array
          items: {$ref: '#/components/schemas/Agent'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    AgentVersionPage:
      type: object
      additionalProperties: false
      required: [versions, offset, limit, total]
      properties:
        versions:
          type: array
          items: {$ref: '#/components/schemas/AgentVersion'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    AgentValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [error, validation]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [AGENT_SPEC_INVALID]}
            message: {type: string}
        validation: {$ref: '#/components/schemas/ValidationReport'}
    CreateRuntimeProfileRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    UpdateRuntimeProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    RuntimeProfile:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, description, latest_revision_number, created_by, created_at, updated_at]
      properties:
        id: {type: string, minLength: 1}
        tenant_id: {type: string, minLength: 1}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
        latest_revision_number: {type: integer, minimum: 1, nullable: true}
        created_by: {type: string, minLength: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    RuntimeProfileModelConfig:
      type: "object"
      additionalProperties: false
      description: "Non-secret model fields; incomplete values may be saved as Draft."
      properties:
        kind:
          type: "string"
          description: "Publication accepts openai_compatible only."
        model:
          type: "string"
        base_url:
          type: "string"
        capabilities:
          type: "array"
          items:
            type: "string"
    RuntimeProfileToolAuthConfig:
      type: "object"
      additionalProperties: false
      properties:
        kind:
          type: "string"
          description: "Publication accepts none or bearer only."
    RuntimeProfileToolConfig:
      type: "object"
      additionalProperties: false
      properties:
        kind:
          type: "string"
          description: "Publication accepts mcp_streamable_http only."
        server_url:
          type: "string"
        toolset_name:
          type: "string"
        tool_name:
          type: "string"
        auth:
          $ref: "#/components/schemas/RuntimeProfileToolAuthConfig"
        capability:
          type: "string"
          description: "Publication requires the AgentSpec capability grammar ^[a-z][a-z0-9_.-]{0,127}$ and exact requirement matching; this declaration does not attest server behavior."
    RuntimeProfileEmbeddingConfig:
      type: "object"
      additionalProperties: false
      properties:
        model:
          type: "string"
        base_url:
          type: "string"
        dimensions:
          type: "integer"
    RuntimeProfileKnowledgeConfig:
      type: "object"
      additionalProperties: false
      properties:
        kind:
          type: "string"
          description: "Publication accepts qdrant_openai only."
        host:
          type: "string"
        port:
          type: "integer"
        tls:
          type: "boolean"
        collection:
          type: "string"
        embedding:
          $ref: "#/components/schemas/RuntimeProfileEmbeddingConfig"
    RuntimeProfileStorageDestination:
      type: object
      additionalProperties: false
      description: Non-secret fixed PostgreSQL destination. Draft fields may be incomplete; publication requires all five fields, port 1..65535 and sslmode disable/require/verify-full. Password and arbitrary driver options are never fields here.
      properties:
        host: {type: string}
        port: {type: integer}
        database: {type: string}
        username: {type: string}
        sslmode: {type: string}
    RuntimeProfileStorageConfig:
      type: "object"
      additionalProperties: false
      properties:
        kind:
          type: "string"
          description: "Publication accepts postgres_state only."
        destination:
          $ref: "#/components/schemas/RuntimeProfileStorageDestination"
    RuntimeProfileExecutorConfig:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          type: string
          enum: [sdk_sandbox]
    RuntimeProfileConfig:
      type: "object"
      additionalProperties: false
      description: "Non-secret typed editor configuration. Draft resource fields may be incomplete or fail publication validation. Credential values and internal IDs are never accepted here. Canonical publication retains the closed V1 kind/capability rules."
      required: ["models", "tools", "knowledge", "storage"]
      properties:
        executors:
          type: object
          maxProperties: 16
          propertyNames:
            pattern: '^[a-z][a-z0-9_-]{0,63}$'
          additionalProperties:
            $ref: '#/components/schemas/RuntimeProfileExecutorConfig'
        models:
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/RuntimeProfileModelConfig"
          maxProperties: 16
        tools:
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/RuntimeProfileToolConfig"
          maxProperties: 64
        knowledge:
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/RuntimeProfileKnowledgeConfig"
          maxProperties: 32
        storage:
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/RuntimeProfileStorageConfig"
          maxProperties: 16
    RuntimeProfileCredentialAction:
      oneOf:
        - type: "object"
          additionalProperties: false
          required: ["action"]
          properties:
            action:
              type: "string"
              enum: ["keep", "clear"]
            expected_credential_revision:
              type: "integer"
              minimum: 0
              maximum: 0
        - type: "object"
          additionalProperties: false
          required: ["action", "value"]
          properties:
            action:
              type: "string"
              enum: ["replace"]
            value:
              type: "string"
              minLength: 1
              maxLength: 65536
              writeOnly: true
              description: "Write-only credential value. Empty values, masks, placeholders, NUL and line breaks are rejected. Managed PostgreSQL/Redis Memory and Redis Session use dsn_password as a raw password, never a DSN; its fixed target comes from the platform catalog. Storage dsn requires a single-host PostgreSQL URI with password and explicit sslmode=disable/require/verify-full; only its password is encrypted while destination is fixed separately."
            expected_credential_revision:
              type: "integer"
              minimum: 0
              maximum: 0
      description: "Omitted actions keep existing associations. Draft actions use expected_draft_revision for CAS; expected_credential_revision may only be zero. Draft replace creates a fresh internal association; keep/clear never include a value. Value is write-only."
    RuntimeProfileCredentialActions:
      type: "object"
      additionalProperties: false
      properties:
        models:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              api_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
        tools:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              bearer_token:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
        knowledge:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              qdrant_api_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
              embedding_api_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
        storage:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              dsn:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
              dsn_password:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
              access_key_id:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
              secret_access_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialAction"
    RuntimeProfileWrite:
      type: "object"
      additionalProperties: false
      description: "Write-only Draft command. Exact field names and object shapes are enforced; duplicate keys and null are rejected. Values never enter the response or Canonical Spec. Internal Credential IDs and legacy *_ref/spec fields are not public inputs."
      required: ["expected_draft_revision", "credential_protocol_version", "config"]
      properties:
        expected_draft_revision:
          type: "integer"
          minimum: 1
        credential_protocol_version:
          type: "string"
          enum: ["v1"]
        config:
          $ref: "#/components/schemas/RuntimeProfileConfig"
        credentials:
          $ref: "#/components/schemas/RuntimeProfileCredentialActions"
    RuntimeProfileDraftWriteResult:
      type: "object"
      additionalProperties: false
      description: "Stable idempotent receipt; use GET Draft for the current redacted view."
      required: ["profile_id", "draft_revision", "updated_at"]
      properties:
        profile_id:
          type: "string"
          minLength: 1
        draft_revision:
          type: "integer"
          minimum: 1
        updated_at:
          type: "string"
          format: "date-time"
    RuntimeProfileCredentialState:
      type: "object"
      additionalProperties: false
      description: "Non-secret current state. The opaque association token targets a revision association; it is not an internal Credential ID."
      required: ["configured", "status", "credential_revision"]
      properties:
        configured:
          type: "boolean"
        status:
          type: "string"
          enum: ["unconfigured", "active", "cleared"]
        credential_revision:
          type: "integer"
          minimum: 0
        association_token:
          type: "string"
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
    RuntimeProfileCredentialStates:
      type: "object"
      additionalProperties: false
      properties:
        models:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              api_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
        tools:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              bearer_token:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
        knowledge:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              qdrant_api_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
              embedding_api_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
        storage:
          type: "object"
          additionalProperties:
            type: "object"
            additionalProperties: false
            properties:
              dsn:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
              dsn_password:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
              access_key_id:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
              secret_access_key:
                $ref: "#/components/schemas/RuntimeProfileCredentialState"
    RuntimeProfileDraft:
      type: "object"
      additionalProperties: false
      description: "Redacted Draft view. No canonical spec, plaintext, ciphertext or internal credential IDs are returned."
      required: ["tenant_id", "profile_id", "schema_version", "credential_protocol_version", "config", "draft_revision", "updated_at"]
      properties:
        tenant_id:
          type: "string"
          minLength: 1
        profile_id:
          type: "string"
          minLength: 1
        schema_version:
          type: "string"
          enum: ["v1"]
        credential_protocol_version:
          type: "string"
          enum: ["v1"]
        config:
          $ref: "#/components/schemas/RuntimeProfileConfig"
        draft_revision:
          type: "integer"
          minimum: 1
        credential_states:
          $ref: "#/components/schemas/RuntimeProfileCredentialStates"
        updated_by:
          type: "string"
        updated_at:
          type: "string"
          format: "date-time"
    RuntimeProfilePublishedRevision:
      type: "object"
      additionalProperties: false
      description: "Static redacted publication result. spec_digest identifies internal Canonical Spec, not the redacted config; dynamic credential state is deliberately absent for immutable publication retry results."
      required: ["tenant_id", "profile_id", "schema_version", "credential_protocol_version", "config", "id", "revision_number", "source_draft_revision", "spec_digest", "published_by", "published_at"]
      properties:
        tenant_id:
          type: "string"
          minLength: 1
        profile_id:
          type: "string"
          minLength: 1
        schema_version:
          type: "string"
          enum: ["v1"]
        credential_protocol_version:
          type: "string"
          enum: ["v1"]
        config:
          $ref: "#/components/schemas/RuntimeProfileConfig"
        id:
          type: "string"
          minLength: 1
        revision_number:
          type: "integer"
          minimum: 1
        source_draft_revision:
          type: "integer"
          minimum: 1
        spec_digest:
          type: "string"
          pattern: "^sha256:[0-9a-f]{64}$"
        published_by:
          type: "string"
        published_at:
          type: "string"
          format: "date-time"
    RuntimeProfileRevision:
      type: "object"
      additionalProperties: false
      description: "Redacted immutable configuration plus current credential state. Complete internal Canonical Spec is integrity-checked before projection, but is never returned."
      required: ["tenant_id", "profile_id", "schema_version", "credential_protocol_version", "config", "id", "revision_number", "source_draft_revision", "spec_digest", "published_by", "published_at"]
      properties:
        tenant_id:
          type: "string"
          minLength: 1
        profile_id:
          type: "string"
          minLength: 1
        schema_version:
          type: "string"
          enum: ["v1"]
        credential_protocol_version:
          type: "string"
          enum: ["v1"]
        config:
          $ref: "#/components/schemas/RuntimeProfileConfig"
        id:
          type: "string"
          minLength: 1
        revision_number:
          type: "integer"
          minimum: 1
        source_draft_revision:
          type: "integer"
          minimum: 1
        spec_digest:
          type: "string"
          pattern: "^sha256:[0-9a-f]{64}$"
        published_by:
          type: "string"
        published_at:
          type: "string"
          format: "date-time"
        credential_states:
          $ref: "#/components/schemas/RuntimeProfileCredentialStates"
    CreateRuntimeProfileResponse:
      type: "object"
      additionalProperties: false
      required: ["profile", "draft"]
      properties:
        profile:
          $ref: "#/components/schemas/RuntimeProfile"
        draft:
          $ref: "#/components/schemas/RuntimeProfileDraft"
    RuntimeProfileDraftRevisionRequest:
      type: "object"
      additionalProperties: false
      required: ["expected_revision"]
      properties:
        expected_revision:
          type: "integer"
          minimum: 1
    RuntimeProfilePublishedCredentialTarget:
      type: "object"
      additionalProperties: false
      required: ["profile_revision_number", "category", "resource_name", "purpose_field", "association_token"]
      oneOf:
        - properties:
            category: {type: string, enum: [models]}
            purpose_field: {type: string, enum: [api_key]}
        - properties:
            category: {type: string, enum: [tools]}
            purpose_field: {type: string, enum: [bearer_token]}
        - properties:
            category: {type: string, enum: [knowledge]}
            purpose_field: {type: string, enum: [qdrant_api_key, embedding_api_key]}
        - properties:
            category: {type: string, enum: [storage]}
            purpose_field: {type: string, enum: [dsn, dsn_password, access_key_id, secret_access_key]}
      properties:
        profile_revision_number:
          type: "integer"
          minimum: 1
        category:
          type: "string"
          enum: ["models", "tools", "knowledge", "storage"]
        resource_name:
          type: "string"
          pattern: "^[a-z][a-z0-9_-]{0,63}$"
        purpose_field:
          type: "string"
          enum: ["api_key", "bearer_token", "qdrant_api_key", "embedding_api_key", "dsn", "dsn_password", "access_key_id", "secret_access_key"]
        association_token:
          type: "string"
          minLength: 64
          maxLength: 64
          pattern: "^[0-9a-f]{64}$"
    RuntimeProfileCredentialUpdate:
      oneOf:
        - type: "object"
          additionalProperties: false
          required: ["target", "action", "expected_credential_revision", "value"]
          properties:
            target:
              $ref: "#/components/schemas/RuntimeProfilePublishedCredentialTarget"
            action:
              type: "string"
              enum: ["replace"]
            expected_credential_revision:
              type: "integer"
              minimum: 1
            value:
              type: "string"
              minLength: 1
              maxLength: 65536
              writeOnly: true
              description: "Write-only credential value. Empty values, masks, placeholders, NUL and line breaks are rejected. Managed PostgreSQL/Redis Memory and Redis Session use dsn_password as a raw password, never a DSN; its fixed target comes from the platform catalog. Storage dsn requires a single-host PostgreSQL URI with password and explicit sslmode=disable/require/verify-full; only its password is encrypted while destination is fixed separately."
        - type: "object"
          additionalProperties: false
          required: ["target", "action", "expected_credential_revision"]
          properties:
            target:
              $ref: "#/components/schemas/RuntimeProfilePublishedCredentialTarget"
            action:
              type: "string"
              enum: ["clear"]
            expected_credential_revision:
              type: "integer"
              minimum: 1
      description: "Owner-only update of a credential association used by a published Revision. Rotation does not modify ProfileRevision or its digest; changing destination requires a new Draft association."
    RuntimeProfileCredentialUpdateResult:
      type: "object"
      additionalProperties: false
      required: ["credential_revision", "status"]
      properties:
        credential_revision:
          type: "integer"
          minimum: 1
        status:
          type: "string"
          enum: ["active", "cleared"]
    RuntimeProfileRevisionSummary:
      type: object
      description: Metadata-only list projection of an immutable Runtime Profile Revision; it never contains spec.
      additionalProperties: false
      required: [id, tenant_id, profile_id, revision_number, source_draft_revision, schema_version, spec_digest, published_by, published_at]
      properties:
        id: {type: string, minLength: 1}
        tenant_id: {type: string, minLength: 1}
        profile_id: {type: string, minLength: 1}
        revision_number: {type: integer, minimum: 1}
        source_draft_revision: {type: integer, minimum: 1}
        schema_version: {type: string, enum: [v1]}
        spec_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        published_by: {type: string, minLength: 1}
        published_at: {type: string, format: date-time}
    RuntimeProfileValidationDiagnostic:
      type: object
      additionalProperties: false
      required: [code, severity, pointer, resource_kind, resource_key, message]
      properties:
        code: {type: string, minLength: 1}
        severity: {type: string, enum: [error, warning]}
        pointer: {type: string}
        resource_kind: {type: string, enum: [model, tool, knowledge, storage], nullable: true}
        resource_key: {type: string, nullable: true}
        message: {type: string}
    RuntimeProfileValidationReport:
      type: object
      additionalProperties: false
      required: [valid, schema_version, draft_revision, diagnostics]
      properties:
        valid: {type: boolean}
        schema_version:
          type: string
          description: The declared schema version string exactly as supplied; empty when the field is missing or is not a string. Unsupported string values are preserved.
        draft_revision: {type: integer, minimum: 1}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/RuntimeProfileValidationDiagnostic'}
    PublishRuntimeProfileRevisionResponse:
      type: object
      additionalProperties: false
      required: [revision]
      properties:
        revision: {$ref: '#/components/schemas/RuntimeProfilePublishedRevision'}
    RuntimeProfilePage:
      type: object
      additionalProperties: false
      required: [runtime_profiles, offset, limit, total]
      properties:
        runtime_profiles:
          type: array
          items: {$ref: '#/components/schemas/RuntimeProfile'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    RuntimeProfileRevisionPage:
      type: object
      additionalProperties: false
      required: [revisions, offset, limit, total]
      properties:
        revisions:
          type: array
          items: {$ref: '#/components/schemas/RuntimeProfileRevisionSummary'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    RuntimeProfileValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [error, validation]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [RUNTIME_PROFILE_SPEC_INVALID]}
            message: {type: string}
        validation: {$ref: '#/components/schemas/RuntimeProfileValidationReport'}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, minLength: 1, maxLength: 1024, format: password}
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, password_change_required]
      properties:
        user: {$ref: '#/components/schemas/CurrentUser'}
        password_change_required: {type: boolean}
    CurrentUser:
      type: object
      additionalProperties: false
      required: [id, username, display_name]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password: {type: string, format: password}
        new_password: {type: string, minLength: 12, maxLength: 128, format: password}
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, temporary_password]
      properties:
        username: {type: string, minLength: 3, maxLength: 32}
        display_name: {type: string, maxLength: 256}
        temporary_password: {type: string, minLength: 12, maxLength: 128, format: password}
    GrantOperatorRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: {type: string, minLength: 1}
    ProvisionTenantRequest:
      type: object
      additionalProperties: false
      required: [slug, name, owner_user_id]
      properties:
        slug: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,31}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        owner_user_id: {type: string, minLength: 1}
    AddMemberRequest:
      type: object
      additionalProperties: false
      required: [user_id]
      properties:
        user_id: {type: string, minLength: 1}
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, status, created_at, updated_at]
      properties:
        id: {type: string}
        username: {type: string}
        display_name: {type: string}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    Operator:
      type: object
      additionalProperties: false
      required: [user_id, granted_at]
      properties:
        user_id: {type: string}
        username: {type: string}
        display_name: {type: string}
        granted_by: {type: string}
        granted_at: {type: string, format: date-time}
    Tenant:
      type: object
      additionalProperties: false
      required: [id, slug, name, status, created_at, updated_at]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [ACTIVE]}
