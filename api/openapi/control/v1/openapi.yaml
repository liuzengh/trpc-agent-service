    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/DeploymentID'
    post:
      operationId: migrateDeploymentBackendAndPublish
      summary: Migrate current Memory snapshots and publish a new Deployment Revision
      description: >-
        Owner-only synchronous V1 operation. Control compiles the target input,
        asks the mTLS Worker migration endpoint to copy and verify current Memory
        snapshots, and only then commits the existing immutable publication and
        Outbox transaction. ChannelBinding traffic is switched separately with
        its own CAS after this call succeeds.
      tags: [Deployment]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/DeploymentIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackendMigrationRequest'}
      responses:
        '200':
          description: Migration and publication were already completed and the publication receipt was replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackendMigrationResponse'}
        '201':
          description: Memory was verified and a new Deployment Revision was published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackendMigrationResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
