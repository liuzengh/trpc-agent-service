            application/json:
              schema: {$ref: '#/components/schemas/UserPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: createPlatformUser
      summary: Create an active user with a temporary password
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateUserRequest'}
      responses:
        '201':
          description: Global user created; password change is required on first login.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/admin/tenants:
    get:
      operationId: listTenantsForOperations
      summary: List Tenants for platform operations
      tags: [Admin]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of Tenants.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: provisionTenant
      summary: Create a Tenant and an initial owner membership
      tags: [Admin]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProvisionTenantRequest'}
      responses:
        '201':
          description: Tenant and initial owner membership created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Tenant'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/deployments/{deployment_id}/revisions/{revision_number}/artifacts/{filename}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/DeploymentID'
      - $ref: '#/components/parameters/DeploymentRevisionNumber'
      - name: filename
        in: path
        required: true
        description: Single basename; slash, backslash, dot and dot-dot are rejected.
        schema: {type: string, minLength: 1, maxLength: 255}
      - name: run_id
        in: query
        required: true
        schema: {type: string, minLength: 1, maxLength: 256}
    get:
      operationId: loadDeploymentArtifact
      summary: Download one Artifact through the fixed Run and Deployment Revision
      description: Owner-only. Worker independently verifies Run tenant and Manifest identity and derives Session scope. No caller-selected backend or credentials are accepted.
      tags: [Deployment]
      security: [{cookieAuth: []}]
      parameters:
        - name: version
          in: query
          required: false
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Raw file bytes, no-store and attachment disposition. Version starts at zero.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '400': {description: Invalid filename or closed query.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Owner or Run/Manifest authorization failed.}
        '404': {description: Artifact or Deployment Revision not found.}
        '413': {description: Artifact exceeds fixed backend or transport limit.}
        '503': {description: "Worker, credentials or backend unavailable."}
    put:
      operationId: saveDeploymentArtifact
      summary: Upload a new Artifact version through the fixed Run and Deployment Revision
      description: Owner-only. Raw bytes are capped at 16 MiB and fixed backend MaxBytes. Version is allocated by Worker; version query is rejected. No automatic retries or implicit idempotency are provided.
      tags: [Deployment]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
          text/plain:
            schema: {type: string}
      responses:
        '200':
          description: Saved Artifact metadata without content or credentials.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [name, version, ref, mime_type, size_bytes, sha256]
                properties:
                  name: {type: string}
                  version: {type: integer, minimum: 0}
                  ref: {type: string}
                  mime_type: {type: string}
                  size_bytes: {type: integer, minimum: 0}
                  sha256: {type: string}
        '400': {description: Invalid filename or closed query.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Owner or Run/Manifest authorization failed.}
        '404': {description: Deployment Revision not found.}
        '413': {description: Artifact exceeds fixed backend or transport limit.}
        '503': {description: "Worker, credentials or backend unavailable."}
  /v1/tenants/{tenant_id}/deployments/{deployment_id}/revisions/{revision_number}/knowledge/{resource}/import:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/DeploymentID'
      - $ref: '#/components/parameters/DeploymentRevisionNumber'
      - name: resource
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 64}
    post:
      operationId: importDeploymentKnowledgeText
      summary: Import plain text into one fixed published Knowledge resource
      description: Owner-only synchronous import. Uses fixed Manifest and Profile credentials. No scope, backend, Run, chunk configuration or credential fields are accepted. Same fixed Knowledge configuration may be reused across Deployment Revisions.
      tags: [Deployment]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, text]
              properties:
                name: {type: string, minLength: 1, maxLength: 255}
                text: {type: string, minLength: 1, description: UTF-8 plain text capped at 1 MiB and fixed backend MaxBytes.}
      responses:
        '200':
          description: Import completed synchronously; document count is reported by Worker.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [documents]
                properties:
                  documents: {type: integer, minimum: 0}
        '400': {description: Invalid closed request.}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {description: Owner or fixed resource authorization failed.}
        '404': {description: Deployment Revision not found.}
        '413': {description: Text exceeds transport or backend limit.}
        '503': {description: "Worker, credentials or backend unavailable."}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: control_session
  parameters:
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    AgentID:
      name: agent_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    DeploymentID:
      name: deployment_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    DeploymentRevisionNumber:
      name: revision_number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    DeploymentIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Stable key for one logical Deployment create or publish command. Reuse
        with an identical payload returns the original fixed result; reuse with
        another payload returns 409. The plaintext key is not persisted.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    ProfileIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for one logical credential mutation; reuse with an identical payload on retry. Reusing with another payload returns 409.
      schema: {type: string, minLength: 1, maxLength: 128, pattern: '^[!-~]+$'}
    UsagePolicyIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable key for one logical policy replacement; identical retries return the original result and changed payloads return 409.
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[!-~]+$'}
    RuntimeProfileID:
      name: profile_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    VersionNumber:
      name: version_number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    ProfileRevisionNumber:
      name: revision_number
      in: path
      required: true
      schema: {type: integer, minimum: 1}
    UserID:
      name: user_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
    Offset:
      name: offset
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
  responses:
    BadRequest:
      description: Request input is invalid.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Unauthorized:
      description: A valid session is required.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Forbidden:
      description: The authenticated user is not authorized or must change a temporary password.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    Conflict:
      description: The requested state change conflicts with current state.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    AgentSpecInvalid:
      description: The AgentSpec cannot be stored safely or published.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AgentValidationErrorResponse'}
    RuntimeProfileSpecInvalid:
      description: The internal RuntimeProfileSpec failed publication validation; diagnostics contain no credential values.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RuntimeProfileValidationErrorResponse'}
    DeploymentRevisionInvalid:
      description: The selected Agent Version and Runtime Profile Revision cannot be published together.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/DeploymentValidationErrorResponse'}
    PayloadTooLarge:
      description: The request body exceeds the fixed endpoint limit.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    ServiceUnavailable:
      description: A required owner service or credential-metadata dependency is temporarily unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    InternalError:
      description: The request could not be completed.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    UsagePolicy:
      type: object
      additionalProperties: false
      required: [schema_version, tenant_id, revision, enabled, im, requests, execution, tokens]
      properties:
        schema_version: {type: integer, const: 1}
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        enabled: {type: boolean}
        im:
          type: object
          additionalProperties: false
          required: [allow_all, rules]
          properties:
            allow_all: {type: boolean}
            rules:
              type: array
              maxItems: 256
              items:
                type: object
                additionalProperties: false
                required: [account_id, user_ids, group_ids]
                properties:
                  account_id: {type: string, minLength: 1, maxLength: 128}
                  binding_id: {type: string, minLength: 1, maxLength: 128}
                  user_ids: {type: array, maxItems: 2048, items: {type: string, minLength: 1, maxLength: 256}}
                  group_ids: {type: array, maxItems: 2048, items: {type: string, minLength: 1, maxLength: 256}}
        requests:
          type: object
          additionalProperties: false
          required: [tenant_per_minute, user_per_minute]
          properties:
            tenant_per_minute: {type: integer, minimum: 0, maximum: 1000000}
            user_per_minute: {type: integer, minimum: 0, maximum: 1000000}
        execution:
          type: object
          additionalProperties: false
          required: [max_concurrent_runs]
          properties:
            max_concurrent_runs: {type: integer, minimum: 0, maximum: 100000}
        tokens:
          type: object
          additionalProperties: false
          required: [period_seconds, limit, reservation_per_run, input_micros_per_million_tokens, output_micros_per_million_tokens]
          properties:
            period_seconds: {type: integer, minimum: 0, maximum: 31536000}
            limit: {type: integer, minimum: 0, maximum: 9007199254740991}
            reservation_per_run: {type: integer, minimum: 0, maximum: 9007199254740991}
            input_micros_per_million_tokens: {type: integer, minimum: 0, maximum: 1000000000}
            output_micros_per_million_tokens: {type: integer, minimum: 0, maximum: 1000000000}
    ReplaceUsagePolicyRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, policy]
      properties:
        expected_revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        policy: {$ref: '#/components/schemas/UsagePolicy'}
    UsageSummary:
      type: object
      additionalProperties: false
      required: [tenant_id, policy_revision, period_seconds, token_limit, used_tokens, reserved_tokens, unknown_usage_count, pending_usage_count, estimated_cost_micros]
      properties:
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        policy_revision: {type: integer, minimum: 0, maximum: 9007199254740991}
        period_start: {type: string, format: date-time}
        period_seconds: {type: integer, minimum: 0, maximum: 31536000}
        token_limit: {type: integer, minimum: 0, maximum: 9007199254740991}
        used_tokens: {type: integer, minimum: 0, maximum: 9007199254740991}
        reserved_tokens: {type: integer, minimum: 0, maximum: 9007199254740991}
        unknown_usage_count: {type: integer, minimum: 0, maximum: 9007199254740991}
        pending_usage_count: {type: integer, minimum: 0, maximum: 9007199254740991}
        estimated_cost_micros: {type: integer, minimum: 0, maximum: 9007199254740991}
    CreateDeploymentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    UpdateDeploymentRequest:
      type: object
      additionalProperties: false
      minProperties: 2
      required: [expected_metadata_revision]
      properties:
        expected_metadata_revision: {type: integer, minimum: 1}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    Deployment:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, description, metadata_revision, latest_revision_number, created_by, created_at, updated_at]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
        metadata_revision: {type: integer, minimum: 1}
        latest_revision_number: {type: integer, minimum: 1, nullable: true}
        created_by: {type: string, minLength: 1, maxLength: 128}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    CreateDeploymentResponse:
      type: object
      additionalProperties: false
      required: [deployment]
      properties:
        deployment: {$ref: '#/components/schemas/Deployment'}
    DeploymentPage:
      type: object
      additionalProperties: false
      required: [deployments, offset, limit, total]
      properties:
        deployments:
          type: array
          items: {$ref: '#/components/schemas/Deployment'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    DeploymentInput:
      $ref: '../../../schemas/deployment/v1/deployment-input.schema.json'
    PublishDeploymentRevisionRequest:
      type: object
      additionalProperties: false
      required: [expected_latest_revision_number, input]
      properties:
        expected_latest_revision_number:
          type: integer
          minimum: 1
          nullable: true
          description: null for the first publication; otherwise the exact current latest revision number.
        input: {$ref: '#/components/schemas/DeploymentInput'}
    BackendMigrationRequest:
      type: object
      additionalProperties: false
      required: [source_revision_number, expected_latest_revision_number, input]
      properties:
        source_revision_number:
          type: integer
          minimum: 1
        expected_latest_revision_number:
          type: integer
          minimum: 1
          nullable: true
        input: {$ref: '#/components/schemas/DeploymentInput'}
    DeploymentValidationDiagnostic:
      type: object
      additionalProperties: false
      required: [code, severity, source, path, category, name, node_id, message]
      properties:
        code:
          type: string
          enum:
            - DEPLOYMENT_INPUT_INVALID
            - DEPLOYMENT_SOURCE_SCHEMA_UNSUPPORTED
            - DEPLOYMENT_RESOURCE_MISSING
            - DEPLOYMENT_CAPABILITY_MISMATCH
            - DEPLOYMENT_UNUSED_REQUIREMENT
            - DEPLOYMENT_STORAGE_ROLE_MISSING
            - DEPLOYMENT_STORAGE_ROLE_UNSUPPORTED
            - DEPLOYMENT_ADAPTER_UNSUPPORTED
            - DEPLOYMENT_ENTRYPOINT_UNSUPPORTED
            - DEPLOYMENT_EXECUTION_RANGE_DENIED
            - DEPLOYMENT_LIMIT_EXCEEDED
            - DEPLOYMENT_CREDENTIAL_UNAVAILABLE
            - DEPLOYMENT_MANIFEST_TOO_LARGE
        severity: {type: string, enum: [error, warning]}
        source: {type: string, enum: [input, agent, profile, platform]}
        path: {type: string}
        category: {type: string, enum: [models, tools, knowledge, storage, nodes], nullable: true}
        name: {type: string, nullable: true}
        node_id: {type: string, nullable: true}
        message: {type: string}
    DeploymentValidationReport:
      type: object
      additionalProperties: false
      required: [valid, compiler_version, platform_contract_digest, diagnostics]
      properties:
        valid: {type: boolean}
        compiler_version: {type: string, enum: [deployment-compiler-v1]}
        platform_contract_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        diagnostics:
          type: array
          items: {$ref: '#/components/schemas/DeploymentValidationDiagnostic'}
    DeploymentRevisionSummary:
      type: object
      additionalProperties: false
      description: Metadata-only immutable publication projection; it never loads canonical input or manifest content JSONB.
      required: [id, tenant_id, deployment_id, revision_number, schema_version, agent_id, agent_version_number, profile_id, profile_revision_number, input_digest, manifest_id, manifest_digest, published_by, published_at]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        deployment_id: {type: string, minLength: 1, maxLength: 128}
        revision_number: {type: integer, minimum: 1}
        schema_version: {type: string, enum: [v1]}
        agent_id: {type: string, minLength: 1, maxLength: 128}
        agent_version_number: {type: integer, minimum: 1}
        profile_id: {type: string, minLength: 1, maxLength: 128}
        profile_revision_number: {type: integer, minimum: 1}
        input_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        manifest_id: {type: string, minLength: 1, maxLength: 128}
        manifest_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        published_by: {type: string, minLength: 1, maxLength: 128}
        published_at: {type: string, format: date-time}
    RuntimeManifestView:
      $ref: '../../../schemas/deployment/v1/runtime-manifest-view.schema.json'
    DeploymentRevision:
      type: object
      additionalProperties: false
      description: >-
        Full immutable publication read. input is canonical source selection;
        manifest_view is derived only after integrity checking the complete
        internal RuntimeManifest. Neither exposes internal Credential IDs.
      required: [id, tenant_id, deployment_id, revision_number, schema_version, agent_id, agent_version_number, profile_id, profile_revision_number, input, input_digest, manifest_id, manifest_digest, manifest_view, published_by, published_at]
      properties:
        id: {type: string, minLength: 1, maxLength: 128}
        tenant_id: {type: string, minLength: 1, maxLength: 128}
        deployment_id: {type: string, minLength: 1, maxLength: 128}
        revision_number: {type: integer, minimum: 1}
        schema_version: {type: string, enum: [v1]}
        agent_id: {type: string, minLength: 1, maxLength: 128}
        agent_version_number: {type: integer, minimum: 1}
        profile_id: {type: string, minLength: 1, maxLength: 128}
        profile_revision_number: {type: integer, minimum: 1}
        input: {$ref: '#/components/schemas/DeploymentInput'}
        input_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        manifest_id: {type: string, minLength: 1, maxLength: 128}
        manifest_digest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: Digest of complete internal canonical manifest content, not of manifest_view.
        manifest_view: {$ref: '#/components/schemas/RuntimeManifestView'}
        published_by: {type: string, minLength: 1, maxLength: 128}
        published_at: {type: string, format: date-time}
    DeploymentRevisionPage:
      type: object
      additionalProperties: false
      required: [revisions, offset, limit, total]
      properties:
        revisions:
          type: array
          items: {$ref: '#/components/schemas/DeploymentRevisionSummary'}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
    PublishDeploymentRevisionResponse:
      type: object
      additionalProperties: false
      required: [revision, validation]
      properties:
        revision: {$ref: '#/components/schemas/DeploymentRevision'}
        validation: {$ref: '#/components/schemas/DeploymentValidationReport'}
    BackendMigrationResponse:
      type: object
      additionalProperties: false
      required: [memory_scopes_copied, publication]
      properties:
        memory_scopes_copied: {type: integer, minimum: 0}
        publication: {$ref: '#/components/schemas/PublishDeploymentRevisionResponse'}
    DeploymentValidationErrorResponse:
      type: object
      additionalProperties: false
      required: [error, validation]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: {type: string, enum: [DEPLOYMENT_REVISION_INVALID]}
            message: {type: string}
        validation: {$ref: '#/components/schemas/DeploymentValidationReport'}
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    UpdateAgentRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 128}
        description: {type: string, maxLength: 4096}
    Agent:
      type: object
      additionalProperties: false
      required: [id, tenant_id, name, description, latest_version_number, created_by, created_at, updated_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        name: {type: string}
        description: {type: string}
        latest_version_number: {type: integer, minimum: 1, nullable: true}
        created_by: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AgentDraft:
      type: object
      additionalProperties: false
      required: [agent_id, tenant_id, revision, spec, updated_by, updated_at]
      properties:
        agent_id: {type: string}
        tenant_id: {type: string}
        revision: {type: integer, minimum: 1}
        spec:
          type: object
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    AgentVersion:
      type: object
      additionalProperties: false
      required: [id, tenant_id, agent_id, version_number, source_draft_revision, schema_version, spec, spec_digest, published_by, published_at]
      properties:
        id: {type: string}
        tenant_id: {type: string}
        agent_id: {type: string}
        version_number: {type: integer, minimum: 1}
        source_draft_revision: {type: integer, minimum: 1}
        schema_version: {type: string, enum: [v1]}
        spec:
          $ref: '../../../schemas/agentspec/v1/agent-spec.schema.json'
        spec_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        published_by: {type: string}
        published_at: {type: string, format: date-time}
    CreateAgentResponse:
      type: object
      additionalProperties: false
      required: [agent, draft]
      properties:
        agent: {$ref: '#/components/schemas/Agent'}
        draft: {$ref: '#/components/schemas/AgentDraft'}
    SaveAgentDraftRequest:
      type: object
      additionalProperties: false
      required: [expected_revision, spec]
