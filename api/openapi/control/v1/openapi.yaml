openapi: 3.1.0
info:
  title: Control API
  version: 1.0.0
  description: V1 HTTP contract for Identity, platform administration, Tenant membership, Agent authoring, Runtime Profile authoring, and Deployment publication.
servers:
  - url: /
tags:
  - name: Health
  - name: Identity
  - name: Admin
  - name: Tenant
  - name: Agent
  - name: Runtime Profile
    description: >-
      Tenant-scoped concrete resource authoring with write-only credentials and
      redacted read views. Deployment matches exact resource category and name;
      no Environment or user resource mapping table is required. Draft credential
      actions and published-association updates require Idempotency-Key. Internal
      Canonical Spec and Credential IDs are never part of the public HTTP contract.
  - name: Channel
    description: Tenant ChannelAccount and exact ChannelBinding; enabled by explicit platform Channel configuration.
  - name: Deployment
    description: >-
      Tenant-scoped immutable publication of one exact Agent Version with one
      exact Runtime Profile Revision. Deployment V1 has no Draft, Environment,
      latest selector, user binding map, automatic activation, or credential
      value transport. Public manifest_view is an explicit projection without
      Credential IDs, purposes, audiences, values, or dynamic credential state.
  - name: Operations
    description: Tenant-authorized Run history and business audit projections.
paths:
  /v1/tenants/{tenant_id}/runs:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listRuns
      tags: [Operations]
      summary: List tenant Run records
      description: Reads the Worker-owned execution ledger through Control; never returns message bodies, credentials, or Session content.
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Run page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Runtime observation source unavailable}
  /v1/tenants/{tenant_id}/runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: run_id
        in: path
        required: true
        schema: {type: string}
    get:
      operationId: getRun
      tags: [Operations]
      summary: Get a Run execution timeline
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Run detail
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Run not found in this tenant}
        '503': {description: Runtime observation source unavailable}
  /v1/tenants/{tenant_id}/audit-events:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listAuditEvents
      tags: [Operations]
      summary: List tenant business audit events
      description: Merges Control-owned configuration facts and Worker-owned execution facts after tenant authorization.
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: An audit source is unavailable}
  /v1/tenants/{tenant_id}/usage-policy:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: getTenantUsagePolicy
      tags: [Operations]
      summary: Read the current tenant usage policy
      description: Active members may read the current policy. Absence is represented as a disabled revision-zero policy.
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePolicy'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    put:
      operationId: replaceTenantUsagePolicy
      tags: [Operations]
      summary: Replace the current tenant usage policy
      description: Owner-only, CAS-protected replacement. Revision is concurrency control; V1 does not expose policy history.
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/UsagePolicyIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceUsagePolicyRequest'}
      responses:
        '200':
          description: Replaced policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsagePolicy'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/tenants/{tenant_id}/usage-summary:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: getTenantUsageSummary
      tags: [Operations]
      summary: Read Worker-owned usage accounting for the latest period
      description: Unknown Provider usage retains its reservation and is never reported as zero. Estimated cost is not a Provider invoice.
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current usage projection
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /v1/tenants/{tenant_id}/tool-approvals:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listToolApprovals
      tags: [Operations]
      summary: List exact side-effecting tool operations awaiting or carrying a decision
      description: Active tenant members may read redacted operation summaries. Raw arguments and provider results are not returned.
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Tool approval page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolApprovalPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {description: Worker approval source unavailable}
  /v1/tenants/{tenant_id}/tool-approvals/{operation_id}/decision:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - name: operation_id
        in: path
        required: true
        schema: {type: string, pattern: '^tap_[0-9a-f]{64}$'}
    post:
      operationId: decideToolApproval
      tags: [Operations]
      summary: Approve or reject one exact test-ticket status operation
      description: OWNER-only. expected_arguments_digest prevents a stale page or changed parameters from consuming an approval. Replaying the same decision is idempotent.
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ToolApprovalDecisionRequest'}
      responses:
        '200':
          description: Durable decision or identical replay
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ToolApprovalDecisionResponse'}
        '400': {description: Invalid decision}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {description: Approval not found in this tenant}
        '409': {description: "Stale digest, opposite decision, expiry, or execution already started"}
        '503': {description: Worker approval source unavailable}
  /v1/tenants/{tenant_id}/runtime-backends:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listRuntimeBackends
      summary: List platform backends available to the current tenant
      description: Requires active membership; returns metadata only, never physical targets or credentials.
      tags: [Runtime Profile]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Authorized backend metadata, including disabled selections
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, revision, label, kind, roles, available]
                      properties:
                        id: {type: string}
                        revision: {type: integer, minimum: 1, maximum: 9007199254740991}
                        label: {type: string}
                        kind: {type: string, enum: [postgresql, redis, qdrant, s3]}
                        roles:
                          type: array
                          items: {type: string, enum: [session, memory, knowledge, artifact]}
                        available: {type: boolean}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: Current membership or directory dependency unavailable
  /v1/tenants/{tenant_id}/channel-accounts/{account_id}/preflights:
    $ref: "./preflight-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-accounts~1{account_id}~1preflights"
  /v1/tenants/{tenant_id}/channel-accounts/{account_id}/preflights/{preflight_id}:
    $ref: "./preflight-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-accounts~1{account_id}~1preflights~1{preflight_id}"
  /v1/tenants/{tenant_id}/channel-accounts:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-accounts"
  /v1/tenants/{tenant_id}/channel-accounts/{account_id}:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-accounts~1{account_id}"
  /v1/tenants/{tenant_id}/channel-accounts/{account_id}/credentials/{purpose}/update:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-accounts~1{account_id}~1credentials~1{purpose}~1update"
  /v1/tenants/{tenant_id}/channel-accounts/{account_id}/enabled:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-accounts~1{account_id}~1enabled"
  /v1/tenants/{tenant_id}/channel-bindings:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-bindings"
  /v1/tenants/{tenant_id}/channel-bindings/{binding_id}:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-bindings~1{binding_id}"
  /v1/tenants/{tenant_id}/channel-bindings/{binding_id}/target:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-bindings~1{binding_id}~1target"
  /v1/tenants/{tenant_id}/channel-bindings/{binding_id}/traffic:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-bindings~1{binding_id}~1traffic"
  /v1/tenants/{tenant_id}/channel-bindings/{binding_id}/enabled:
    $ref: "./channel-public.yaml#/paths/~1v1~1tenants~1{tenant_id}~1channel-bindings~1{binding_id}~1enabled"
  /healthz:
    get:
      operationId: getHealth
      summary: Check process health
      tags: [Health]
      responses:
        '204':
          description: The process is serving requests.
  /v1/auth/login:
    post:
      operationId: loginWithPassword
      summary: Log in with a local username and password
      tags: [Identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded and a server-side session was created.
          headers:
            Set-Cookie:
              description: HttpOnly opaque session cookie. The token is never returned in JSON.
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429':
          description: The per-process, per-peer login attempt limit was exceeded.
          headers:
            Retry-After:
              description: Seconds until the current fixed window expires.
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [Identity]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Session revoked and cookie cleared.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me:
    get:
      operationId: getCurrentUser
      summary: Get the current authenticated user
      tags: [Identity]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current identity and password rotation state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me/change-password:
    post:
      operationId: changeCurrentPassword
      summary: Replace the current password and unlock a restricted session
      tags: [Identity]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePasswordRequest'}
      responses:
        '204':
          description: Password changed; other sessions were revoked.
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/me/tenants:
    get:
      operationId: listMyTenants
      summary: List Tenant memberships for the current user
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant memberships.
          content:
            application/json:
              schema:
                type: object
                required: [tenants]
                properties:
                  tenants:
                    type: array
                    items: {$ref: '#/components/schemas/TenantMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: getTenant
      summary: Get a Tenant visible to the current member
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant and caller role.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TenantMembership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/member-candidates:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: searchTenantMemberCandidates
      summary: Search active non-members that the Tenant Owner may add
      tags: [Tenant]
      security: [{cookieAuth: []}]
      parameters:
        - name: query
          in: query
          required: true
          description: Case-insensitive username or display-name search text; surrounding whitespace is trimmed before enforcing the 1–256 character limit.
          schema: {type: string, minLength: 1, maxLength: 256}
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of ACTIVE platform users who are not already Tenant members.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MemberCandidatePage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/members:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    get:
      operationId: listTenantMembers
      summary: List members of a Tenant as its Owner
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Tenant members.
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items: {$ref: '#/components/schemas/Membership'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    post:
      operationId: addTenantMember
      summary: Add an existing active user as a Tenant member as its Owner
      tags: [Tenant]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AddMemberRequest'}
      responses:
        '201':
          description: Membership created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Membership'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/UserID'
    delete:
      operationId: removeTenantMember
      summary: Remove a non-owner member from a Tenant as its Owner
      tags: [Tenant]
      security: [{cookieAuth: []}]
      responses:
        '204':
          description: Membership removed.
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents:
    parameters:
      - $ref: '#/components/parameters/TenantID'
    post:
      operationId: createAgent
      summary: Create an Agent and its initial Draft atomically
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentRequest'}
      responses:
        '201':
          description: Agent and initial Draft created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateAgentResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listAgents
      summary: List Agents in the Tenant
      tags: [Agent]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Page of Agents.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentPage'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    get:
      operationId: getAgent
      summary: Get an Agent
      tags: [Agent]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Agent metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    patch:
      operationId: updateAgent
      summary: Update mutable Agent metadata
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentRequest'}
      responses:
        '200':
          description: Updated Agent metadata.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Agent'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}/draft:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    get:
      operationId: getAgentDraft
      summary: Get the current mutable Agent Draft
      tags: [Agent]
      security: [{cookieAuth: []}]
      responses:
        '200':
          description: Current Agent Draft.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentDraft'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/InternalError'}
    put:
      operationId: saveAgentDraft
      summary: Compare-and-swap the current Agent Draft
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SaveAgentDraftRequest'}
      responses:
        '200':
          description: Draft saved at the next revision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentDraft'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AgentSpecInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}/draft/validate:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    post:
      operationId: validateAgentDraft
      summary: Validate one exact Draft revision for publication
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftRevisionRequest'}
      responses:
        '200':
          description: Validation completed; valid may be false.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationReport'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '500': {$ref: '#/components/responses/InternalError'}
  /v1/tenants/{tenant_id}/agents/{agent_id}/versions:
    parameters:
      - $ref: '#/components/parameters/TenantID'
      - $ref: '#/components/parameters/AgentID'
    post:
      operationId: publishAgentVersion
      summary: Publish an immutable version from one exact Draft revision
      tags: [Agent]
      security: [{cookieAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DraftRevisionRequest'}
      responses:
        '200':
          description: The same Draft revision was already published; its Version is returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishAgentVersionResponse'}
        '201':
          description: A new immutable Agent Version was published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublishAgentVersionResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/AgentSpecInvalid'}
        '500': {$ref: '#/components/responses/InternalError'}
    get:
      operationId: listAgentVersions
      summary: List immutable versions of an Agent
      tags: [Agent]
      security: [{cookieAuth: []}]
      parameters:
        - $ref: '#/components/parameters/Offset'
