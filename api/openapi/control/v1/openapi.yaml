      - $ref: '#/components/parameters/DeploymentRevisionNumber'
    get:
      operationId: getDeploymentRevision
      summary: Get one immutable Deployment Revision and public manifest view
      description: >-
        Verifies stored canonical input, complete internal Manifest content,
        digests, and cross-record identities before projecting manifest_view.
        Internal Credential IDs and dynamic credential state are not returned.
