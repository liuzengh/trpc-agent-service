      "post": {
        "operationId": "setChannelBindingTraffic",
        "tags": ["Channel"],
        "summary": "setChannelBindingTraffic",
        "security": [{"cookieAuth": []}],
        "description": "Publishes one exact canary target beside the stable target. Explicit sender IDs are selected first; all other senders use deterministic basis-point assignment. Zero basis points pauses all canary traffic. Requires tenant OWNER, binding CAS, and an Idempotency-Key.",
        "parameters": [
          {
            "name": "Idempotency-Key",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string",
              "minLength": 1,
              "maxLength": 128,
              "pattern": "^[!-~]+$"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "../../../schemas/channel/v1/binding-traffic.schema.json"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Traffic policy accepted and projected; no-store.",
            "content": {
              "application/json": {
                "schema": {"$ref": "#/components/schemas/ChannelCommandResult"}
              }
            }
          },
          "400": {"description": "Invalid closed request or policy."},
          "401": {"description": "Authentication required."},
          "403": {"description": "Tenant OWNER required."},
          "404": {"description": "Binding or exact canary target not found."},
          "409": {"description": "Binding CAS or idempotency conflict."},
          "413": {"description": "Request body exceeds 64 KiB."},
          "500": {"description": "Stored integrity failure."},
          "503": {"description": "Authorization or exact-target dependency unavailable."}
        }
      }
    },
