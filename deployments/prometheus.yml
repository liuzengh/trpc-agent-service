# Prometheus scrape config for the platform stack.
#
# Metrics leave the platform over OTLP; the OTel collector re-exports them in
# Prometheus format at :8889, so that is the target Prometheus scrapes. The
# collector is scraped rather than the backend so that a node that is down,
# restarting or crash-looping is visible as a scrape gap instead of simply
# disappearing from the metric list.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
