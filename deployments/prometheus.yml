# Prometheus scrape config for the local stack.
# The platform exports metrics over OTLP; the OTel collector re-exports them
# in Prometheus format at :8889, which is the only target Prometheus scrapes.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
