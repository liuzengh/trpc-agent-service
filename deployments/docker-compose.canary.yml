# Canary / blue-green override for the PLATFORM version.
#
#   bash scripts/canary.sh up          # build + start the new build (v2)
#   bash scripts/canary.sh weight 10   # send 10% of the traffic to it
#   bash scripts/canary.sh check 200   # verify the observed split
#   bash scripts/canary.sh rollback    # 0% and drain v2
#   bash scripts/canary.sh promote     # make v2 the primary build
#
# Usage: docker compose -f deployments/docker-compose.yml \
#                       -f deployments/docker-compose.canary.yml ...
#
# Two decisions worth understanding before reading the file:
#
# 1. `backend-v2` runs `-role worker`, not `-role all`. The IM gateway is
#    STATEFUL: one bot account can only be held by one process, so a second
#    `all` node would open a competing WSS connection for the same bot and
#    double-answer every message. The rollout therefore moves the stateless
#    surface (chat + conversation API + message consumption) onto the new build
#    by percentage, and keeps the stateful gateway a blue/green switch (stop the
#    old one, start the new one — see the manual).
#
# 2. `backend-v2` publishes no host port. It is reachable only through the edge,
#    so there is no way to bypass the rollout by hitting it directly, and the
#    two builds are indistinguishable from outside except by /version.
services:
  # The primary (current) build gets an explicit label too, so /version answers
  # "which build is this?" without having to compare image ids. In a real
  # rollout this env is unnecessary — the image tag already differs — but while
  # both services are built from the same source it is what makes the routing
  # evidence unambiguous.
  backend:
    environment:
      TRPC_BUILD_VERSION: ${PRIMARY_VERSION:-v1}
      TRPC_INSTANCE_ID: ${PRIMARY_VERSION:-v1}

  backend-v2:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Stamped into the binary and reported by GET /version, which is how
        # the rollout is verified from outside.
        APP_VERSION: ${CANARY_VERSION:-v2}
    restart: unless-stopped
    command: ["--config", "/etc/trpc-service/config.yaml", "--role", "worker"]
    environment:
      TRPC_SECRET_MASTER_KEY: ${TRPC_SECRET_MASTER_KEY:-dev-master-key-change-me}
      TRPC_BUILD_VERSION: ${CANARY_VERSION:-v2}
      # A distinct instance id makes /version able to tell the two builds apart
      # even when they share a hostname.
      TRPC_INSTANCE_ID: ${CANARY_VERSION:-v2}
      ADMIN_TENANT_ID: ${ADMIN_TENANT_ID:-t-demo}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      TRPC_MYSQL_DSN: ${TRPC_MYSQL_DSN:-root:trpc123@tcp(mysql:3306)/trpc_agent_service?parseTime=true&multiStatements=true}
    volumes:
      - ./backend-compose.config.yaml:/etc/trpc-service/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    volumes:
      # Replaces the image's baked nginx.conf: the upstream decision (and the
      # weight) becomes runtime state that canary.sh can change and reload.
      - ./canary/edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ./canary/weight.conf:/etc/nginx/conf.d/weight.conf:ro
