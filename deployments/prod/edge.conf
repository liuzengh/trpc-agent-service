# Production edge: TLS termination, SPA hosting, and the API route split that
# mirrors the node roles.
#
# Why split the routes by role instead of pointing everything at one upstream:
# a production deployment runs the management API on the control-plane node and
# the conversation surface on the worker nodes (see cmd/trpc-service/role.go).
# The edge is where that decision becomes routing:
#
#   /api/chat*, /api/sessions*, /api/dlq*  -> the worker pool (stateless, scale out)
#   everything else /api/*                 -> the control-plane node
#
# The worker pool is addressed by its compose service name, so
# `docker compose up -d --scale backend-worker=3` is all it takes to add
# capacity — nginx resolves the name per request through Docker's DNS and picks
# up new replicas within `valid=10s`.
server {
    listen 80;
    server_name _;
    # Redirect, do not serve: a platform that carries credentials and tenant
    # data must not be reachable over plaintext.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    # Modern defaults; a real deployment should use a managed certificate and
    # keep these in sync with its TLS policy.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Defence in depth for the SPA: the API is same-origin, so no third party
    # needs to frame or script it.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS: a proxy_pass that contains a variable is resolved
    # per request, so this line is what makes the upstream maps below work.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Conversation surface: stateless, so it is the part that scales and the
    # part a rollout can shift first.
    location ~ ^/api/(chat|sessions|dlq)(/|$) {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-worker:8080;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    # Management surface: the control plane. Reads are cheap and writes must not
    # race between two nodes, so this stays on one node.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://backend-admin:8080;
        include /etc/nginx/conf.d/proxy-common.inc;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
