# Platform secrets (dev values). In production replace with an external secret
# manager (Vault / cloud KMS) + External Secrets Operator; never commit real
# credentials. stringData is base64-encoded by Kubernetes automatically.
#
# config.yaml holds the backend's full YAML config (the platform reads one YAML
# file only; DSN secrets live here, never in the ConfigMap). The backend pod
# mounts it at /etc/trpc-service/config.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: trpc-agent
type: Opaque
stringData:
  mysql-root-password: "trpc123"
  mysql-database: "trpc_agent_service"
  minio-access-key: "minioadmin"
  minio-secret-key: "minioadmin"
  # JSON map of endpoint_id -> api_key; model api keys must never appear in
  # logs, traces, or error reports.
  model-api-keys: "{}"
  config.yaml: |
    server:
      http_addr: ":8080"
    log:
      level: "info"
    role: "all"
    mysql:
      dsn: "root:trpc123@tcp(mysql:3306)/trpc_agent_service?parseTime=true&multiStatements=true"
    redis:
      url: "redis://redis:6379/0"
    milvus:
      address: "milvus:19530"
      username: ""
      password: ""
    minio:
      endpoint: "artifact-minio:9000"
      access_key: "minioadmin"
      secret_key: "minioadmin"
      bucket: "artifacts"
      use_ssl: false
    telemetry:
      otlp_endpoint: "otel-collector:4317"
      service_name: "trpc-agent-service"
