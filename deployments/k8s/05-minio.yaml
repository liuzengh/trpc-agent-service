# Artifact object storage (MinIO, S3 protocol).
apiVersion: v1
kind: Service
metadata:
  name: artifact-minio
  namespace: trpc-agent
spec:
  selector:
    app: artifact-minio
  ports:
    - port: 9000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifact-minio
  namespace: trpc-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: artifact-minio
  template:
    metadata:
      labels:
        app: artifact-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2023-03-20T20-16-18Z
          args: ["server", "/data"]
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: minio-access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: minio-secret-key
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: artifact-minio-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: artifact-minio-pvc
  namespace: trpc-agent
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
