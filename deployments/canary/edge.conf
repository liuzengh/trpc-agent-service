# Edge config for the canary / blue-green rollout of the PLATFORM version.
#
# This file replaces the plain front/nginx.conf of the frontend container when
# the canary override is active. It serves the same static SPA and proxies the
# same /api prefix, but the upstream is chosen per request:
#
#   * a tenant on the pilot list always goes to the new build (deterministic,
#     explainable: "these pilot tenants are on v2");
#   * everyone else is split by weight (split_clients), keyed on a sticky
#     cookie so one user keeps hitting one build instead of flapping between
#     two UIs mid-session.
#
# The weight and the pilot tenant list live in weight.conf, which
# scripts/canary.sh regenerates and reloads — a rollout step is a config reload,
# not a redeploy.

# The generated part: $forced_v2 / $weighted_v2 / $backend_upstream.
include /etc/nginx/conf.d/weight.conf;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # A proxy_pass that contains a variable is resolved per request, so nginx
    # needs a resolver — and in a compose network that is Docker's embedded DNS.
    # Without this line the edge answers 502 "no resolver defined" for every API
    # call. The short validity means a service that appears or disappears (the
    # canary node being added or drained) is picked up within seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # SPA fallback: let Vue Router own client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy: /api/* -> backend /api strips the prefix, then the upstream is
    # decided by the canary maps. A variable proxy_pass cannot carry a URI, so
    # the prefix is stripped with a rewrite first.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # Server-Sent-Events (/chat/stream) must stream through: the backend
        # already sends X-Accel-Buffering: no, and buffering is disabled here so
        # the reply is not held in nginx.
        proxy_buffering off;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
