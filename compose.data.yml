# Isolated integration profile; all credentials below are local test fixtures.
services:
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:16379:6379"]
  postgres:
    image: postgres:16-alpine
    ports: ["127.0.0.1:15432:5432"]
    environment:
      POSTGRES_USER: trpc
      POSTGRES_PASSWORD: trpc
      POSTGRES_DB: trpc_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trpc -d trpc_agent"]
      interval: 1s
      timeout: 2s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.16.0
    ports: ["127.0.0.1:16334:6334"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    ports: ["127.0.0.1:19000:9000"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
