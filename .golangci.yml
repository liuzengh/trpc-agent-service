version: "2"

linters:
  default: none
  enable:
    - govet
    - revive
    - gocyclo
    - gosec
    - ineffassign
  settings:
    gocyclo:
      min-complexity: 20
    revive:
      rules:
        - name: package-comments
        - name: exported
          arguments:
            - disable-stuttering-check
  exclusions:
    rules:
      # Function-scoped complexity baseline; remove entries as each function is split.
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - .*\.pb\.go$
      - .*_mock\.go$
