# Codecov status checks (shown on PRs).
# CI uploads the single native Go coverage profile generated by scripts/coverage.sh.
# This file makes the required 85% project and patch targets visible in Codecov
# reports and PR status checks.
# Codecov evaluates the default project and patch reports at 85% with no
# tolerated decrease and publishes their status results to pull requests.
# GitHub branch protection or a ruleset decides whether an emitted status is
# merge-blocking. scripts/coverage.sh only produces the upload artifact; it
# does not implement a separate local --min gate.
# The live example entrypoint is exercised only by the opt-in Telegram workflow;
# its credential-free unit tests cover the pure helpers and boundary setup.
ignore:
  - "examples/telegram-e2e/main.go"

coverage:
  status:
    project:
      default:
        target: 85% # required coverage for the whole project
        threshold: 0%
    patch:
      default:
        target: 85% # required coverage for changed lines in a PR
        threshold: 0%
