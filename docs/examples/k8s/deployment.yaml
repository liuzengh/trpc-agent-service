apiVersion: apps/v1
kind: Deployment
metadata: {name: trpc-agent-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: trpc-agent-gateway}}
  template:
    metadata: {labels: {app: trpc-agent-gateway}}
    spec:
      containers:
        - name: gateway
          image: example.invalid/trpc-agent-service:phase7
          args: [gateway, -addr, :8080]
          envFrom: [{secretRef: {name: trpc-agent-secrets}}]
          readinessProbe: {httpGet: {path: /readyz, port: 8080}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: trpc-agent-worker}
spec:
  replicas: 3
  selector: {matchLabels: {app: trpc-agent-worker}}
  template:
    metadata: {labels: {app: trpc-agent-worker}}
    spec:
      containers:
        - name: worker
          image: example.invalid/trpc-agent-service:phase7
          args: [worker, -health-addr, :8081]
          envFrom: [{secretRef: {name: trpc-agent-secrets}}]
          readinessProbe: {httpGet: {path: /readyz, port: 8081}}
