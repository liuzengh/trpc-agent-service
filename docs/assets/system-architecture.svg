<svg xmlns="http://www.w3.org/2000/svg" id="platform-architecture" width="1840" height="2040" viewBox="0 0 1840 2040" role="img" aria-labelledby="pa-title pa-description">
<title id="pa-title">基于 tRPC-Agent-Go 的多租户 Agent 平台系统架构</title>
<desc id="pa-description">控制面管理租户、应用版本、通道绑定、工具权限及后端授权。企业微信和 Telegram 回调由 Gateway 验签后持久化至 PostgreSQL Inbox；Consumer 领取消息，经内部签名调用无状态 Worker。Worker 复用 tRPC-Agent-Go Runner 并在进程内装配租户级治理与数据服务，结果返回后由 Consumer 原子完成 Inbox、回复 Outbox 和待生成摘要任务。Delivery 可靠投递回复；Summary Worker 独立调用模型并发布摘要 checkpoint。Session 和 Memory 分别选择 Redis 或 PostgreSQL；Knowledge 使用 Qdrant，Artifact 使用 S3 或 MinIO 保存正文并在 PostgreSQL 保存版本元数据。协调 Redis、配置、审计、迁移记录和租户可选数据后端职责分离。可信 trace 在 Gateway 建立，traceparent 随队列持久化并在消费时恢复，串联模型、工具、存储及回复。各进程可独立扩展，故障通过持久化任务与租约接管恢复。</desc>
