<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">两个开关，控制两件事</title><desc id="desc">账户接入决定是否接收；消息路由决定新消息使用哪一个固定的部署版本。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ea880"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#153533}.small{font-size:19px;fill:#64755b}.label{font-size:23px;font-weight:650}.mono{font-family:ui-monospace,monospace;font-size:20px}.line{fill:none;stroke:#8ea880;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1200" height="620" rx="24" fill="#f0f5e9"/><text x="44" y="58" font-size="29" font-weight="700">两个开关，控制两件事</text><text x="44" y="92" class="small">账户接入决定是否接收；消息路由决定新消息使用哪一个固定的部署版本。</text><rect x="44" y="135" width="538" height="164" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="44" y="153" width="5" height="32" rx="2" fill="#748568"/><text x="68" y="175" class="label">接入停用 + 路由暂停</text><text x="68" y="213" class="small">适合：准备、维护、暂不上线</text><text x="68" y="242" class="small">填写凭据和固定目标，不开始新消息服务</text><rect x="618" y="135" width="538" height="164" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="618" y="153" width="5" height="32" rx="2" fill="#db9a2d"/><text x="642" y="175" class="label">接入启用 + 路由暂停</text><text x="642" y="213" class="small">适合：保持连接，暂停新消息交给 Agent</text><text x="642" y="242" class="small">暂停路由不是停止已有运行的按钮</text><rect x="44" y="334" width="538" height="174" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="44" y="352" width="5" height="32" rx="2" fill="#db9a2d"/><text x="68" y="374" class="label">接入停用 + 路由意图开启</text><text x="68" y="412" class="small">接入已停；之前的路由意图仍保留</text><text x="68" y="441" class="small">重新启用可能恢复到服务端保存的目标</text><text x="68" y="470" class="small">维护时想避免恢复接单，先暂停消息路由</text><rect x="618" y="334" width="538" height="174" rx="16" fill="#edf5e7" stroke="#dce6d3"/><rect x="618" y="352" width="5" height="32" rx="2" fill="#19876d"/><text x="642" y="374" class="label">接入启用 + 路由开启</text><text x="642" y="412" class="small">正常上线配置</text><text x="642" y="441" class="small">仍需查看连接观测并实际发送消息</text><text x="642" y="470" class="small">收到正确回复，才完成面向使用者的验收</text><text x="44" y="596" font-size="15" fill="#748568">Agent tRPC · V1 使用指南 · 操作示意图（不是运行状态截图）</text></svg>