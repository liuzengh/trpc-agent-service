<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc"><title id="title">从一个想法，到一个可对话的 Agent</title><desc id="desc">先发布固定版本，再接入机器人；每一步都留下可辨认的结果。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ea880"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#153533}.small{font-size:19px;fill:#64755b}.label{font-size:23px;font-weight:650}.mono{font-family:ui-monospace,monospace;font-size:20px}.line{fill:none;stroke:#8ea880;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1200" height="640" rx="24" fill="#f0f5e9"/><text x="44" y="58" font-size="29" font-weight="700">从一个想法，到一个可对话的 Agent</text><text x="44" y="92" class="small">先发布固定版本，再接入机器人；每一步都留下可辨认的结果。</text><rect x="44" y="130" width="338" height="144" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="44" y="148" width="5" height="32" rx="2" fill="#087f68"/><text x="68" y="170" class="label">01 · Agent：定义行为</text><text x="68" y="208" class="small">Instruction + 一个 LLM 节点</text><text x="68" y="237" class="small">发布为 Agent v1</text><rect x="44" y="330" width="338" height="170" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="44" y="348" width="5" height="32" rx="2" fill="#087f68"/><text x="68" y="370" class="label">02 · Profile：准备资源</text><text x="68" y="408" class="small">Models.primary → 模型与 API Key</text><text x="68" y="437" class="small">Storage.session → 会话数据库</text><text x="68" y="466" class="small">发布为 Profile r1</text><path class="line" d="M382 202H433V280H474"/><path class="line" d="M382 410H433V280H474"/><rect x="480" y="212" width="300" height="154" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="480" y="230" width="5" height="32" rx="2" fill="#087f68"/><text x="504" y="252" class="label">03 · Deployment</text><text x="504" y="290" class="small">固定选择 Agent v1 + Profile r1</text><text x="504" y="319" class="small">同类别、同名 key 自动配对</text><text x="504" y="348" class="small">发布为 Deployment r1</text><path class="line" d="M780 289H820"/><rect x="826" y="156" width="330" height="268" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="826" y="174" width="5" height="32" rx="2" fill="#087f68"/><text x="850" y="196" class="label">04 · Channel：上线入口</text><text x="850" y="234" class="small">保存机器人账户（停用）</text><text x="850" y="263" class="small">预检 / 诊断 → 保存固定目标</text><text x="850" y="292" class="small">启用本平台接入</text><text x="850" y="321" class="small">开启消息路由</text><text x="850" y="350" class="small">发送两轮消息并确认回复</text><rect x="480" y="458" width="676" height="112" rx="15" fill="#e8f0df"/><text x="505" y="493" class="label">升级时只替换你明确选择的版本</text><text x="505" y="529" class="small">新 Draft 或新发布版本，不会自动改变正在使用的渠道目标。</text><text x="44" y="616" font-size="15" fill="#748568">Agent tRPC · V1 使用指南 · 操作示意图（不是运行状态截图）</text></svg>