<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">名称对应关系：只需对齐 key</title><desc id="desc">显示名称可以是中文；参与资源配对的 key 使用小写英文、数字、下划线或连字符。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8ea880"/></marker></defs><style>text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#153533}.small{font-size:19px;fill:#64755b}.label{font-size:23px;font-weight:650}.mono{font-family:ui-monospace,monospace;font-size:20px}.line{fill:none;stroke:#8ea880;stroke-width:3;marker-end:url(#arrow)}</style><rect width="1200" height="490" rx="24" fill="#f0f5e9"/><text x="44" y="58" font-size="29" font-weight="700">名称对应关系：只需对齐 key</text><text x="44" y="92" class="small">显示名称可以是中文；参与资源配对的 key 使用小写英文、数字、下划线或连字符。</text><rect x="44" y="135" width="480" height="142" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="44" y="153" width="5" height="32" rx="2" fill="#087f68"/><text x="68" y="175" class="label">Agent · Requirements.models.primary</text><text x="68" y="213" class="small">逻辑需求：chat</text><text x="68" y="242" class="small">节点 Model Slot：primary</text><rect x="660" y="135" width="496" height="142" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="660" y="153" width="5" height="32" rx="2" fill="#087f68"/><text x="684" y="175" class="label">Profile · Models / primary</text><text x="684" y="213" class="small">实际模型：你的模型服务名称</text><text x="684" y="242" class="small">连接地址 + API Key + chat</text><path class="line" d="M524 205H654"/><text x="550" y="181" font-size="18" fill="#087f68">同名</text><rect x="44" y="320" width="1112" height="104" rx="16" fill="#ffffff" stroke="#dce6d3"/><rect x="44" y="338" width="5" height="32" rx="2" fill="#087f68"/><text x="68" y="360" class="label">Profile · Storage / session</text><text x="68" y="398" class="small">session 是 V1 必需的会话存储角色；不填入 Agent 的 Models / Tools / Knowledge 槽位。</text><text x="44" y="466" font-size="15" fill="#748568">Agent tRPC · V1 使用指南 · 操作示意图（不是运行状态截图）</text></svg>