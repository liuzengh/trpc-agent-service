apiVersion: v1
kind: ConfigMap
metadata:
  name: trpc-agent-service
data:
  TRPC_SERVICE_LISTEN_ADDR: ":8080"
  TRPC_SERVICE_REDIS_ADDR: "redis.default.svc.cluster.local:6379"
  TRPC_SERVICE_MEM0_BASE_URL: "http://mem0.default.svc.cluster.local:8000"
  TRPC_SERVICE_ADMIN_USERNAME: "admin"
  TRPC_SERVICE_ADMIN_PASSWORD_REF: "env:TRPC_SERVICE_ADMIN_PASSWORD"
  TRPC_SERVICE_EMBEDDING_MODEL: "text-embedding-3-small"
  TRPC_SERVICE_EMBEDDING_API_KEY_REF: "env:TRPC_SERVICE_EMBEDDING_API_KEY"
  TRPC_SERVICE_EMBEDDING_DIMENSIONS: "1536"
  TRPC_SERVICE_CONFIG_CACHE_TTL: "30s"
  TRPC_SERVICE_DEDUP_INFLIGHT_TTL: "90s"
  TRPC_SERVICE_DEDUP_DONE_TTL: "24h"
