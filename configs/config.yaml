server:
  http_addr: ":8080"
log:
  level: "info"

# Backends. Leave mysql.dsn empty to keep all management domains in memory.
# mysql:
#   dsn: "root:root@tcp(127.0.0.1:3306)/agentplatform?parseTime=true"
# redis:
#   url: "redis://127.0.0.1:6379/0"

# Vector backend for knowledge bases. Leave address empty to keep KB vectors
# in memory (dev mode; data is lost on restart).
# milvus:
#   address: "127.0.0.1:19530"
#   username: ""
#   password: ""

# S3-compatible object store for agent artifacts (bytes; version metadata is
# encoded in the object keys). Leave endpoint empty to disable artifact
# persistence (runner runs without an artifact service).
# minio:
#   endpoint: "127.0.0.1:9000"
#   access_key: "minioadmin"
#   secret_key: "minioadmin"
#   bucket: "artifacts"
#   use_ssl: false

# Unified credential store (model api keys + IM channel credentials), encrypted
# at rest with AES-256-GCM. master_key is also settable via env
# TRPC_SECRET_MASTER_KEY (env wins). With MySQL, a missing master key disables
# the credential store (plaintext is never written at rest).
# secret:
#   master_key: "change-me-to-a-strong-passphrase"

# IM gateway (real WSS adapters: WeCom aibot long connection + Feishu Lark).
# enabled + account identity live here; the credential VALUE lives in the
# secret store and is referenced by credential_ref key. The account must also
# be bound to a tenant+agent via the admin channel page (account_id = bot_id /
# app_id); an enabled but unbound bot is skipped on start with a warning.
# im:
#   wecom:
#     enabled: false
#     bot_id: "your-wecom-bot-id"
#     credential_ref: "wecom:bot:secret"
#   feishu:
#     enabled: false
#     app_id: "cli_xxxx"
#     bot_open_id: "ou_xxxx"   # bot's own open_id, for group @-mention gating
#     credential_ref: "feishu:app:secret"

# Observability. Leave otlp_endpoint empty to keep the noop provider (all
# recording becomes a no-op). Point it at an OTLP collector (see
# configs/otel-collector.yaml) to export traces + metrics to Jaeger/Prometheus.
# telemetry:
#   otlp_endpoint: "127.0.0.1:4317"
#   service_name: "trpc-agent-service"

