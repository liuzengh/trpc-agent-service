name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trpcservice/web/console/package-lock.json
      - name: Build console and run checks
        run: ./scripts/regression.sh
      - run: ./build.sh
      - run: docker build -t trpc-agent-service:ci .
