---
name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true
      - name: Install static checker
        run: >-
          go install
          github.com/golangci/golangci-lint/cmd/golangci-lint@v1.59.1
      - name: Download pinned modules
        run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Quality checks
        run: ./lint.sh
      - name: Test
        run: go test ./...
      - name: Race test tenant boundaries
        run: >-
          go test ./trpcservice/tenant
          ./trpcservice/config
          ./trpcservice/platform
          -race
