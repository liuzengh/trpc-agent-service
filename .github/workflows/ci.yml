name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: trpcservice/web/console/package-lock.json
      - name: Build application
        run: ./build.sh
      - name: Run tests
        run: go test -race ./...
      - name: Static checks
        run: ./lint.sh
      - name: Check whitespace
        run: git diff --check
      - name: Build container image
        run: docker build -t trpc-agent-service:ci .
