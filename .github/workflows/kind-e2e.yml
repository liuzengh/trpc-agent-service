name: kind-e2e

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  kind-e2e:
    name: Kind deployment and readiness E2E
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create Kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: trpc-agent
      - name: Run the reusable Kind gate
        run: scripts/kind-e2e.sh
      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kind-kubernetes-evidence
          path: deploy/kubernetes/kind/evidence
